name: Configure IBKR primary daily once

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only preflight or execute the reviewed one-time setup
        required: true
        type: choice
        default: preflight
        options:
          - preflight
          - execute
          - multi-preflight
          - multi-execute
          - execution-preflight
          - execution-execute
      execution_platform:
        description: Previously matched execution platform
        type: choice
        required: false
        options: [longbridge, firstrade]
      execution_digest:
        description: Nonce-bound existing source comparison digest
        required: false
        type: string
      comparison_nonce:
        description: Nonce used by the existing protected source comparisons
        required: false
        type: string
      comparison_run_1:
        description: Completed additional slot 1 comparison run ID
        required: false
        type: string
      comparison_run_2:
        description: Completed additional slot 2 comparison run ID
        required: false
        type: string
      comparison_run_3:
        description: Completed additional slot 3 comparison run ID
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: strategy-switch-console-deploy
  cancel-in-progress: false

jobs:
  setup:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: runtime-strategy-switch
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID: ${{ secrets.STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID || vars.STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID }}
      RUNTIME_SETTINGS_GH_TOKEN: ${{ secrets.RUNTIME_SETTINGS_GH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      DAILY_SETUP_MODE: ${{ inputs.mode }}
      DAILY_EXECUTION_PLATFORM: ${{ inputs.execution_platform }}
      DAILY_EXECUTION_DIGEST: ${{ inputs.execution_digest }}
      DAILY_COMPARISON_NONCE: ${{ inputs.comparison_nonce }}
      DAILY_COMPARISON_RUN_1: ${{ inputs.comparison_run_1 }}
      DAILY_COMPARISON_RUN_2: ${{ inputs.comparison_run_2 }}
      DAILY_COMPARISON_RUN_3: ${{ inputs.comparison_run_3 }}
      PLATFORM_CONTROL_EXPECTED_VERSION: ${{ secrets.PLATFORM_CONTROL_EXPECTED_VERSION }}
    steps:
      - name: Require the first execution attempt
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Configure the fixed primary target once
        run: node web/strategy-switch-console/ibkr_daily_setup_transport.mjs
