name: Diagnose 958 selector on fixed active Worker
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: strategy-switch-console-deploy
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: runtime-strategy-switch
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Verify fixed diagnostic sources and current main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]]
          git merge-base --is-ancestor 299bbb34a65432b58c4df0b0543135de69a34dfa "$GITHUB_SHA"
          [[ "$(git hash-object scripts/console_active_module_probe.mjs)" == 8d8fd143062b4768af76951f7d8ba41dd219c166 ]]
          [[ "$(git hash-object scripts/console_54e_baseline_build.sh)" == 64bd7e5472fe989287504636927b11c6815151e5 ]]
          [[ "$(git hash-object web/strategy-switch-console/package.json)" == f2fa9ce1dbf70e2dd38b1d8001c6da360a2e382e ]]
          [[ "$(git hash-object web/strategy-switch-console/frontend/package.json)" == 8e78984705ca005d2d7e1392670ba8210deb8208 ]]
          [[ "$(git hash-object web/strategy-switch-console/package-lock.json)" == b86fa425b9ceae406200615c608a183f53b3331c ]]
          [[ "$(git hash-object web/strategy-switch-console/frontend/package-lock.json)" == 6974b71eba1eef0bee0039f074b6331be8f93f46 ]]
          [[ "$(git hash-object scripts/console_958_selector_probe.mjs)" == d284756adceef9a345863c950b32e89acf47c690 ]]
          [[ "$(git hash-object tests/console_958_selector_probe.test.mjs)" == 6ae6ca2baf55e4d09295fda2c3f80b839f1e7290 ]]
      - name: Build fixed historical comparison and run synthetic checks
        env:
          CLOUDFLARE_CF_FETCH_ENABLED: 'false'
          npm_config_update_notifier: 'false'
        run: |
          set -euo pipefail
          npm ci --prefix web/strategy-switch-console
          npm ci --prefix web/strategy-switch-console/frontend
          bash scripts/console_54e_baseline_build.sh
          node --test tests/console_958_selector_probe.test.mjs
      - name: Read fixed active version and compare selector
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]]
          node scripts/console_958_selector_probe.mjs
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$GITHUB_SHA" ]]
