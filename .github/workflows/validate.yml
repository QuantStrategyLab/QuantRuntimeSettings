name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Actionlint
        uses: docker://rhysd/actionlint:1.7.12

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python packaging tools
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install build -e ./python
      - name: Verify Python dependencies
        run: python3 -m pip check
      - name: Check whitespace
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            git diff --check "origin/${{ github.base_ref }}...HEAD"
          else
            git diff-tree --check --no-commit-id --root -r HEAD
          fi
      - name: Validate platform config
        run: python3 python/scripts/build_config.py --check
      - name: Validate runtime targets
        run: python3 python/scripts/runtime_settings.py validate
      - name: Run Python unit tests
        run: python3 -m unittest discover -s python/tests -v
      - name: Build Python package
        run: python3 -m build ./python
      - name: Checkout internal dependency consumer repos
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash python/shell/checkout_internal_dependency_consumers.sh --output-root ..
      - name: Report internal dependency matrix
        run: python3 python/scripts/check_internal_dependency_matrix.py --projects-root .. --json --require-consumer-files
      - name: Enforce internal dependency matrix when its ledger changes
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            comparison_range="origin/${{ github.base_ref }}...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            comparison_range="HEAD^...HEAD"
          else
            echo "No parent commit is available; reporting dependency drift without a strict ledger gate."
            exit 0
          fi
          if git diff --quiet "$comparison_range" -- internal_dependency_matrix.json; then
            echo "Internal dependency ledger did not change; retaining the report without making this unrelated PR non-hermetic."
            exit 0
          fi
          python3 python/scripts/check_internal_dependency_matrix.py --projects-root .. --json --strict --require-consumer-files

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install local Worker test runtime
        working-directory: web/strategy-switch-console
        run: npm ci
      - name: Validate strategy switch web assets
        run: |
          set -euo pipefail
          npm ci --prefix web/strategy-switch-console/frontend
          npm run build --prefix web/strategy-switch-console/frontend
          npm run sync:v2-assets --prefix web/strategy-switch-console/frontend
          npm run test:operations --prefix web/strategy-switch-console/frontend
          node tests/console_v2_i18n_validation.mjs
          node tests/console_account_state_validation.mjs
          node --experimental-strip-types tests/console_presentation_validation.mjs
          node tests/console_catalog_release_validation.mjs
          git diff --exit-code -- web/strategy-switch-console/v2_asset_map.js
          python3 python/scripts/build_config.py --check
          python3 python/scripts/build_config.py
          python3 python/scripts/build_platform_config.py --check
          git diff --exit-code -- web/strategy-switch-console/config.js web/strategy-switch-console/strategy_profiles_asset.js web/strategy-switch-console/runtime-catalog-projection.json
          jq empty web/strategy-switch-console/strategy-profiles.example.json
          node --experimental-default-type=module tests/strategy_switch_worker_validation.mjs
          node --experimental-strip-types tests/research_summary_worker_validation.mjs
          node tests/console_v2_worker_validation.mjs
          node --experimental-default-type=module tests/runtime_instances_worker_validation.mjs
          node --experimental-default-type=module tests/account_diagnosis_worker_validation.mjs
          node --experimental-default-type=module tests/research_promotion_application_worker_validation.mjs
          node tests/human_decisions_worker_validation.mjs
          node tests/account_settings_worker_validation.mjs
          node --experimental-strip-types tests/account_settings_state_validation.mjs
          node --experimental-strip-types tests/runtime_stop_worker_validation.mjs
          node tests/runtime_stop_requests_worker_validation.mjs
          node --experimental-default-type=module tests/binance_resume_worker_validation.mjs
          node --experimental-default-type=module tests/ux1_research_worker_validation.mjs
          node --experimental-default-type=module tests/ux1_async_worker_validation.mjs
          node --experimental-default-type=module tests/ux1_async_ui_validation.mjs
          node --experimental-strip-types --test tests/console_runtime_state_validation.mjs
          node --check --input-type=module < web/strategy-switch-console/strategy_profiles_asset.js
          node --check --input-type=module < web/strategy-switch-console/worker.js
