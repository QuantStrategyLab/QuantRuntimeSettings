name: Digest Bot Identity (read-only)

# Observe the existing daily sender's Environment winner via getMe only.
# The public receipt contains fixed status and nullable equality, no identities.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: runtime-strategy-switch
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      QSL_GLOBAL_TELEGRAM_CHAT_ID: ${{ secrets.QSL_GLOBAL_TELEGRAM_CHAT_ID }}
      GLOBAL_TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_TELEGRAM_CHAT_ID }}
      INPUT_EVENT_NAME: ${{ github.event_name }}
      INPUT_REF: ${{ github.ref }}
      SOURCE_SHA: ${{ github.sha }}
      # No new authentication or private vars injection in this diagnostic.
      DIAGNOSTIC_SM_AUTH_STATUS: unavailable
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Observe the selected daily sender configuration
        run: python3 python/scripts/diagnose_digest_route_identity.py
