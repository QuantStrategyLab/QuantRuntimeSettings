name: Deploy Strategy Switch Console

on:
  workflow_dispatch:
    inputs:
      sync_secrets:
        description: "After deploy, synchronize Worker secrets. Disable to retain deployed secrets."
        required: true
        type: boolean
        default: false
      sync_strategy_profiles:
        description: "After deploy, write the bundled strategy profile catalog to KV."
        required: true
        type: boolean
        default: false
      read_only_preflight:
        description: "Read deployment/version metadata only. Do not deploy or synchronize anything."
        required: true
        type: boolean
        default: false
      skip_binance_receiver_checks:
        description: "Skip only Binance readiness GETs and receiver-credential POST; retain all other checks."
        required: true
        type: boolean
        default: false
      source_sha:
        description: "Optional reviewed historical main source. Only e2aab576 is approved for this release."
        required: false
        type: string
        default: ""
      rollback_to_pre_release:
        description: "Restore only the verified pre-release c88234c2 version; never build or sync. Read-only mode takes priority."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: strategy-switch-console-deploy
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.read_only_preflight
    runs-on: ubuntu-latest
    environment: runtime-strategy-switch
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Read bounded Worker version metadata
        run: |
          node --input-type=module <<'JS'
          // Same deployment identity, fixed API host/Worker, GET only, first page only.
          // Native API avoids CLI telemetry, credential discovery and raw CLI logs.
          // https://developers.cloudflare.com/api/resources/workers/subresources/scripts/subresources/deployments/methods/list/
          // https://developers.cloudflare.com/api/resources/workers/subresources/scripts/subresources/versions/methods/list/
          const fail = () => { throw new Error('worker_preflight_failed'); };
          const uuid = value => typeof value === 'string' && /^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(value) ? value : fail();
          const time = value => {
            // date-time permits explicit offsets. Validate the local calendar too:
            // Date.parse alone normalizes invalid dates such as February 30.
            const match = typeof value === 'string' && /^(\d{4}-\d{2}-\d{2})[Tt](\d{2}:\d{2}:\d{2})(?:\.\d{1,9})?([Zz]|[+-]\d{2}:\d{2})$/.exec(value);
            if (!match) fail();
            const wall = `${match[1]}T${match[2]}Z`;
            const offset = match[3];
            if (!Number.isFinite(Date.parse(wall)) || new Date(wall).toISOString().slice(0, 19) !== wall.slice(0, 19)
              || (offset.length > 1 && (Number(offset.slice(1, 3)) > 23 || Number(offset.slice(4)) > 59))
              || !Number.isFinite(Date.parse(value.toUpperCase()))) fail();
            return value; // Do not truncate fractional precision or rewrite the offset.
          };
          const list = (value, minimum = 0) => Array.isArray(value) && value.length >= minimum && value.length <= 10 ? value : fail();
          const distinct = values => new Set(values).size === values.length || fail();
          // Only fixed schema names, types and bounded counts. Never emit unknown
          // key names: even a JSON key can contain account data or a credential.
          const shape = (value, keys = []) => {
            const type = value === null ? 'null' : Array.isArray(value) ? 'array' : typeof value;
            if (type === 'array') return { type, count: Math.min(value.length, 11) };
            if (type !== 'object') return { type };
            const fields = {};
            for (const key of keys) if (Object.hasOwn(value, key)) fields[key] = shape(value[key]);
            return { type, fields, other_key_count: Math.min(Object.keys(value).length - Object.keys(fields).length, 11) };
          };
          let stage = 'configuration';
          let httpStatus = null;
          let checkpoint = 'configuration';
          let responseShape = {};
          try {
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            if (!token || !/^[0-9a-f]{32}$/i.test(account ?? '')) fail();
            const worker = 'qsl-strategy-switch-console';
            const base = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}`;
            async function read(endpoint) {
              stage = endpoint;
              httpStatus = null;
              checkpoint = 'request';
              responseShape = {};
              const response = await fetch(`${base}/${endpoint}?page=1&per_page=10`, {
                method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
                headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
              });
              httpStatus = Number.isInteger(response.status) && response.status >= 100 && response.status <= 599 ? response.status : null;
              checkpoint = 'http_status';
              if (!response.ok) {
                await response.body?.cancel();
                fail();
              }
              checkpoint = 'response_content_type';
              if (!/^application\/json(?:\s*;|$)/i.test(response.headers.get('content-type') ?? '')) {
                await response.body?.cancel();
                fail();
              }
              checkpoint = 'response_body';
              const reader = response.body.getReader();
              const chunks = [];
              let length = 0;
              try {
                for (;;) {
                  const { value, done } = await reader.read();
                  if (done) break;
                  length += value.byteLength;
                  if (length > 65536) { checkpoint = 'response_size'; await reader.cancel(); fail(); }
                  chunks.push(value);
                }
              } finally { reader.releaseLock(); }
              checkpoint = 'response_utf8';
              const text = new TextDecoder('utf-8', { fatal: true }).decode(Buffer.concat(chunks));
              checkpoint = 'response_json';
              const body = JSON.parse(text);
              responseShape.envelope = shape(body, ['success', 'result', 'errors', 'messages']);
              checkpoint = 'envelope_success';
              if (body?.success !== true) fail();
              responseShape.result = shape(body.result, ['deployments', 'items']);
              return body.result;
            }
            // The first deployment is actively serving traffic (provider contract).
            const deploymentResult = await read('deployments');
            checkpoint = 'deployments_list';
            const deployments = list(deploymentResult?.deployments, 1).map(item => {
              responseShape.entry = shape(item, ['id', 'created_on', 'versions']);
              checkpoint = 'deployment_versions';
              const versions = list(item?.versions, 1).map(entry => {
                responseShape.version_entry = shape(entry, ['version_id', 'percentage']);
                checkpoint = 'deployment_percentage';
                if (!entry) fail();
                // Wrangler 4.106.0 permits an idle version at 0%; retain it.
                // Every weight remains finite/in-range and the total must be 100.
                if (!Number.isFinite(entry.percentage) || entry.percentage < 0 || entry.percentage > 100) fail();
                checkpoint = 'deployment_version_id';
                return { version_id: uuid(entry.version_id), percentage: entry.percentage };
              });
              checkpoint = 'deployment_version_duplicate';
              distinct(versions.map(entry => entry.version_id));
              checkpoint = 'deployment_percentage_total';
              if (Math.abs(versions.reduce((sum, entry) => sum + entry.percentage, 0) - 100) > 0.000001) fail();
              checkpoint = 'deployment_id';
              const id = uuid(item.id);
              checkpoint = 'deployment_time';
              return { id, created_on: time(item.created_on), versions };
            });
            checkpoint = 'deployment_duplicate';
            distinct(deployments.map(item => item.id));
            // Do not use deployable=true: that API option ignores pagination.
            const versionResult = await read('versions');
            checkpoint = 'versions_list';
            const versions = list(versionResult?.items).map(item => {
              responseShape.entry = shape(item, ['id', 'metadata']);
              responseShape.metadata = shape(item?.metadata, ['created_on']);
              checkpoint = 'version_id';
              const id = uuid(item?.id);
              checkpoint = 'version_time';
              return { id, created_on: time(item.metadata?.created_on) };
            });
            checkpoint = 'version_duplicate';
            distinct(versions.map(item => item.id));
            console.log(JSON.stringify({
              ok: true, worker, read_only: true, active: deployments[0],
              recent_deployments: deployments, recent_versions: versions,
              active_versions_in_first_version_page: deployments[0].versions.every(active => versions.some(item => item.id === active.version_id)),
              rollback_compatibility: 'NOT_VERIFIED', next_pages_read: false,
            }));
          } catch {
            // Never print provider bodies, author/config fields, auth or exception text.
            console.error(JSON.stringify({ ok: false, error: 'worker_preflight_failed', stage, http_status: httpStatus,
              checkpoint, response_shape: responseShape }));
            process.exitCode = 1;
          }
          JS

  deploy:
    if: github.event_name == 'workflow_dispatch' && !inputs.read_only_preflight && !inputs.rollback_to_pre_release
    runs-on: ubuntu-latest
    environment: runtime-strategy-switch
    timeout-minutes: 15
    env:
      WORKER_DIR: web/strategy-switch-console
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WRANGLER_CONFIG_TOML: ${{ secrets.CLOUDFLARE_WRANGLER_CONFIG_TOML }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID: ${{ secrets.STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID || vars.STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID }}
      STRATEGY_SWITCH_CONSOLE_URL: ${{ vars.STRATEGY_SWITCH_CONSOLE_URL }}
      UX1_PREVIEW_MODE: ${{ vars.UX1_PREVIEW_MODE }}
      UX1_UES_REVISION: ${{ vars.UX1_UES_REVISION }}
      UX1_RUNTIME_EPOCH: ${{ vars.UX1_RUNTIME_EPOCH }}
      UX1_EXPECTED_EVIDENCE_HASHES: ${{ vars.UX1_EXPECTED_EVIDENCE_HASHES }}
      ACCOUNT_FACTS_READ_MODEL_ENABLED: ${{ vars.ACCOUNT_FACTS_READ_MODEL_ENABLED }}
      RUNTIME_DAILY_READ_MODEL_ENABLED: ${{ vars.RUNTIME_DAILY_READ_MODEL_ENABLED }}
      STRATEGY_SWITCH_SYNC_TOKEN: ${{ secrets.STRATEGY_SWITCH_SYNC_TOKEN || secrets.RUNTIME_SETTINGS_GH_TOKEN }}
      STRATEGY_HEALTH_SYNC_TOKEN: ${{ secrets.STRATEGY_HEALTH_SYNC_TOKEN }}
      CONTROL_PLANE_SYNC_TOKEN: ${{ secrets.CONTROL_PLANE_SYNC_TOKEN }}
      AAB_VALIDATION_SYNC_TOKEN: ${{ secrets.AAB_VALIDATION_SYNC_TOKEN }}
      RESEARCH_TASK_SYNC_TOKEN: ${{ secrets.RESEARCH_TASK_SYNC_TOKEN }}
      RESEARCH_PROMOTION_SYNC_TOKEN: ${{ secrets.RESEARCH_PROMOTION_SYNC_TOKEN }}
      EXECUTION_EVIDENCE_SYNC_TOKEN: ${{ secrets.EXECUTION_EVIDENCE_SYNC_TOKEN }}
      RECONCILIATION_RECOVERY_SYNC_TOKEN: ${{ secrets.RECONCILIATION_RECOVERY_SYNC_TOKEN }}
      RECONCILIATION_RECOVERY_CONTROLLER_TOKEN: ${{ secrets.RECONCILIATION_RECOVERY_CONTROLLER_TOKEN }}
      ACCOUNT_FACTS_SYNC_TOKEN: ${{ secrets.ACCOUNT_FACTS_SYNC_TOKEN }}
      IBKR_ACCOUNT_FACTS_SYNC_TOKEN: ${{ secrets.IBKR_ACCOUNT_FACTS_SYNC_TOKEN }}
      SCHWAB_ACCOUNT_FACTS_SYNC_TOKEN: ${{ secrets.SCHWAB_ACCOUNT_FACTS_SYNC_TOKEN }}
      FIRSTRADE_ACCOUNT_FACTS_SYNC_TOKEN: ${{ secrets.FIRSTRADE_ACCOUNT_FACTS_SYNC_TOKEN }}
      BINANCE_ACCOUNT_FACTS_SYNC_TOKEN: ${{ secrets.BINANCE_ACCOUNT_FACTS_SYNC_TOKEN }}
      BINANCE_ACCOUNT_FACTS_BINDING_JSON: ${{ secrets.BINANCE_ACCOUNT_FACTS_BINDING_JSON }}
      BINANCE_ACCOUNT_FACTS_HISTORY_BINDINGS_JSON: ${{ secrets.BINANCE_ACCOUNT_FACTS_HISTORY_BINDINGS_JSON || '[]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select reviewed historical main source
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          # Empty input preserves the original workflow-ref deployment behavior.
          if [ -z "$RELEASE_SOURCE_SHA" ]; then exit 0; fi
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$RELEASE_SOURCE_SHA" != "e2aab576d6874feeaf87df3411411ad04ee02d4f" ]; then
            echo "unapproved_console_release_source" >&2
            exit 2
          fi
          control_sha="$(git rev-parse HEAD)"
          if [ "$control_sha" != "$GITHUB_SHA" ]; then
            echo "console_control_source_mismatch" >&2
            exit 2
          fi
          git cat-file -e "${RELEASE_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SOURCE_SHA" "$control_sha"
          expected_tree="968b323ca75ee48d0c92bfe0b7f4110c3d27df72"
          if [ "$(git rev-parse "${RELEASE_SOURCE_SHA}^{tree}")" != "$expected_tree" ]; then
            echo "console_release_tree_mismatch" >&2
            exit 2
          fi
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SOURCE_SHA"
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SOURCE_SHA" ] || [ "$(git rev-parse 'HEAD^{tree}')" != "$expected_tree" ]; then
            echo "console_selected_source_mismatch" >&2
            exit 2
          fi
          printf 'Reviewed console source: %s tree: %s\n' "$RELEASE_SOURCE_SHA" "$expected_tree"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build new console and embedded assets
        env:
          CLOUDFLARE_CF_FETCH_ENABLED: "false"
          npm_config_update_notifier: "false"
        run: |
          set -euo pipefail
          node tests/console_v2_assets_validation.mjs
          npm ci --prefix web/strategy-switch-console
          npm ci --prefix web/strategy-switch-console/frontend
          npm run build --prefix web/strategy-switch-console/frontend
          npm run sync:v2-assets --prefix web/strategy-switch-console/frontend
          node tests/console_v2_assets_validation.mjs
          npm run test:operations --prefix web/strategy-switch-console/frontend
          node tests/console_v2_i18n_validation.mjs
          node tests/console_v2_worker_validation.mjs
          node tests/ibkr_period_return_validation.mjs
          node --experimental-strip-types tests/market_benchmark_validation.mjs
          node tests/console_catalog_release_validation.mjs
          node --experimental-default-type=module tests/binance_account_facts_validation.mjs
          node tests/binance_receiver_deploy_acceptance_validation.mjs

      - name: Build config & assets from platform-config.json
        run: |
          set -euo pipefail
          python3 python/scripts/build_platform_config.py
          python3 python/scripts/build_platform_config.py --check

      - name: Validate Worker assets
        run: |
          set -euo pipefail
          jq empty web/strategy-switch-console/strategy-profiles.example.json
          node --check --input-type=module < web/strategy-switch-console/strategy_profiles_asset.js
          node --check --input-type=module < web/strategy-switch-console/v2_asset_map.js
          node --check --input-type=module < web/strategy-switch-console/worker.js

      - name: Validate optional Binance account-facts binding
        if: env.BINANCE_ACCOUNT_FACTS_BINDING_JSON != ''
        working-directory: web/strategy-switch-console
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { normalizeBinanceFactsBinding, assertBinanceFactsSourceBinding, assertBinanceFactsHistoryBindings } from './binance_account_facts.js';
          try {
            const binding = normalizeBinanceFactsBinding(JSON.parse(process.env.BINANCE_ACCOUNT_FACTS_BINDING_JSON));
            await assertBinanceFactsSourceBinding(binding);
            const history = process.env.BINANCE_ACCOUNT_FACTS_HISTORY_BINDINGS_JSON || '[]';
            await assertBinanceFactsHistoryBindings(JSON.parse(history), binding);
          }
          catch { console.error('binance_account_facts_binding_invalid'); process.exit(1); }
          JS

      - name: Prepare Wrangler config
        env:
          UX1_RESEARCH_JOB_TOKEN: ${{ secrets.UX1_RESEARCH_JOB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -z "${CLOUDFLARE_WRANGLER_CONFIG_TOML:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_WRANGLER_CONFIG_TOML is required to deploy the strategy switch console." >&2
            exit 2
          fi
          if [ -n "${CLOUDFLARE_WRANGLER_CONFIG_TOML:-}" ]; then
            mkdir -p "$HOME/.config/.wrangler/config"
            printf '%s' "$CLOUDFLARE_WRANGLER_CONFIG_TOML" > "$HOME/.config/.wrangler/config/default.toml"
            chmod 600 "$HOME/.config/.wrangler/config/default.toml"
          fi
          if [ -z "${STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID:-}" ]; then
            echo "STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID is required so deploy does not drop the STRATEGY_SWITCH_CONFIG binding." >&2
            exit 2
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["WORKER_DIR"])
          source = root / "wrangler.toml.example"
          target = root / "wrangler.toml"
          account_facts_flag = os.environ.get("ACCOUNT_FACTS_READ_MODEL_ENABLED", "")
          if account_facts_flag not in ("", "true", "false"):
              raise SystemExit("ACCOUNT_FACTS_READ_MODEL_ENABLED must be empty, true, or false.")
          account_facts_token = os.environ.get("ACCOUNT_FACTS_SYNC_TOKEN", "")
          ibkr_account_facts_token = os.environ.get("IBKR_ACCOUNT_FACTS_SYNC_TOKEN", "")
          schwab_account_facts_token = os.environ.get("SCHWAB_ACCOUNT_FACTS_SYNC_TOKEN", "")
          firstrade_account_facts_token = os.environ.get("FIRSTRADE_ACCOUNT_FACTS_SYNC_TOKEN", "")
          binance_account_facts_token = os.environ.get("BINANCE_ACCOUNT_FACTS_SYNC_TOKEN", "")
          binance_account_facts_binding = os.environ.get("BINANCE_ACCOUNT_FACTS_BINDING_JSON", "")
          binance_account_facts_history = os.environ.get("BINANCE_ACCOUNT_FACTS_HISTORY_BINDINGS_JSON", "") or "[]"
          if bool(binance_account_facts_token) != bool(binance_account_facts_binding):
              raise SystemExit("Binance account-facts token and binding must be configured together.")
          if binance_account_facts_history != "[]" and not binance_account_facts_binding:
              raise SystemExit("Binance account-facts history bindings require a current binding.")
          if binance_account_facts_token and (
              binance_account_facts_token != binance_account_facts_token.strip()
              or any(ord(c) < 0x20 or ord(c) == 0x7f for c in binance_account_facts_token)
          ):
              raise SystemExit("Binance account-facts token contains invalid whitespace or HTTP controls.")
          account_facts_token_has_http_controls = any(
              ord(character) < 0x20 or ord(character) == 0x7f
              for character in account_facts_token
          )
          if account_facts_flag == "true" and (
              not account_facts_token
              or account_facts_token != account_facts_token.strip()
              or account_facts_token_has_http_controls
          ):
              raise SystemExit("ACCOUNT_FACTS_SYNC_TOKEN must be non-empty without surrounding whitespace or HTTP control characters when account facts are enabled.")
          ibkr_account_facts_token_has_http_controls = any(
              ord(character) < 0x20 or ord(character) == 0x7f
              for character in ibkr_account_facts_token
          )
          if ibkr_account_facts_token and (
              ibkr_account_facts_token != ibkr_account_facts_token.strip()
              or ibkr_account_facts_token_has_http_controls
          ):
              raise SystemExit("IBKR_ACCOUNT_FACTS_SYNC_TOKEN must not have surrounding whitespace or HTTP control characters.")
          schwab_account_facts_token_has_http_controls = any(
              ord(character) < 0x20 or ord(character) == 0x7f
              for character in schwab_account_facts_token
          )
          if schwab_account_facts_token and (
              schwab_account_facts_token != schwab_account_facts_token.strip()
              or schwab_account_facts_token_has_http_controls
          ):
              raise SystemExit("SCHWAB_ACCOUNT_FACTS_SYNC_TOKEN must not have surrounding whitespace or HTTP control characters.")
          if firstrade_account_facts_token and (
              firstrade_account_facts_token != firstrade_account_facts_token.strip()
              or any(ord(c) < 0x20 or ord(c) == 0x7f for c in firstrade_account_facts_token)
          ):
              raise SystemExit("FIRSTRADE_ACCOUNT_FACTS_SYNC_TOKEN contains invalid whitespace or HTTP controls.")
          account_facts_tokens = [
              token for token in (
                  account_facts_token,
                  ibkr_account_facts_token,
                  schwab_account_facts_token,
                  firstrade_account_facts_token,
                  binance_account_facts_token,
              ) if token
          ]
          if len(set(account_facts_tokens)) != len(account_facts_tokens):
              raise SystemExit("Account-facts platform sync tokens must be distinct.")
          account_facts_value = "true" if account_facts_flag == "true" else "false"
          runtime_daily_flag = os.environ.get("RUNTIME_DAILY_READ_MODEL_ENABLED", "")
          if runtime_daily_flag not in ("", "true", "false"):
              raise SystemExit("RUNTIME_DAILY_READ_MODEL_ENABLED must be empty, true, or false.")
          execution_evidence_token = os.environ.get("EXECUTION_EVIDENCE_SYNC_TOKEN", "")
          execution_evidence_token_has_http_controls = any(
              ord(character) < 0x20 or ord(character) == 0x7f
              for character in execution_evidence_token
          )
          if runtime_daily_flag == "true" and (
              not execution_evidence_token
              or execution_evidence_token != execution_evidence_token.strip()
              or execution_evidence_token_has_http_controls
          ):
              raise SystemExit("EXECUTION_EVIDENCE_SYNC_TOKEN must be non-empty without surrounding whitespace or HTTP control characters when runtime daily is enabled.")
          runtime_daily_value = "true" if runtime_daily_flag == "true" else "false"
          text = source.read_text(encoding="utf-8")
          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          if account_id and "\naccount_id" not in text:
              text = text.replace("\n[vars]\n", f"\naccount_id = \"{account_id}\"\n\n[vars]\n", 1)

          kv_id = os.environ["STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID"].strip()
          commented_kv = "\n".join([
              "# [[kv_namespaces]]",
              "# binding = \"STRATEGY_SWITCH_CONFIG\"",
              "# id = \"replace-with-cloudflare-kv-namespace-id\"",
              "",
          ])
          active_kv = "\n".join([
              "[[kv_namespaces]]",
              "binding = \"STRATEGY_SWITCH_CONFIG\"",
              f"id = \"{kv_id}\"",
              "",
          ])
          if commented_kv in text:
              text = text.replace(commented_kv, active_kv, 1)
          elif 'binding = "STRATEGY_SWITCH_CONFIG"' not in text:
              text = text.rstrip() + "\n\n" + active_kv

          account_facts_placeholder = 'ACCOUNT_FACTS_READ_MODEL_ENABLED = "false"'
          if text.count(account_facts_placeholder) != 1 or "[vars]\n" not in text:
              raise SystemExit("wrangler.toml.example must define ACCOUNT_FACTS_READ_MODEL_ENABLED once under [vars].")
          text = text.replace(account_facts_placeholder, f'ACCOUNT_FACTS_READ_MODEL_ENABLED = "{account_facts_value}"', 1)

          runtime_daily_placeholder = 'RUNTIME_DAILY_READ_MODEL_ENABLED = "false"'
          if text.count(runtime_daily_placeholder) != 1 or "[vars]\n" not in text:
              raise SystemExit("wrangler.toml.example must define RUNTIME_DAILY_READ_MODEL_ENABLED once under [vars].")
          text = text.replace(runtime_daily_placeholder, f'RUNTIME_DAILY_READ_MODEL_ENABLED = "{runtime_daily_value}"', 1)

          mode = os.environ.get("UX1_PREVIEW_MODE", "")
          if mode and mode != "github_actions":
              raise SystemExit("UX1_PREVIEW_MODE must be empty or github_actions.")
          if mode == "github_actions":
              import json
              import re

              ues = os.environ.get("UX1_UES_REVISION", "").strip()
              epoch = os.environ.get("UX1_RUNTIME_EPOCH", "").strip()
              token = os.environ.get("UX1_RESEARCH_JOB_TOKEN", "")
              hashes_text = os.environ.get("UX1_EXPECTED_EVIDENCE_HASHES", "")
              if not re.fullmatch(r"[a-f0-9]{40}", ues):
                  raise SystemExit("UX1_UES_REVISION must be a 40-character lowercase SHA.")
              if not re.fullmatch(r"[a-f0-9]{32}", epoch):
                  raise SystemExit("UX1_RUNTIME_EPOCH must be a 32-character lowercase hex value.")
              if not re.fullmatch(r"[!-~]{16,256}", token):
                  raise SystemExit("UX1_RESEARCH_JOB_TOKEN must contain 16-256 printable non-space ASCII characters.")
              expected_keys = {
                  "r7_policy_sha256",
                  "r8_policy_sha256",
                  "capital_policy_sha256",
                  "settlement_policy_sha256",
                  "raw_manifest_sha256",
                  "r6_manifest_sha256",
                  "r6_materialized_file_sha256",
              }
              try:
                  hashes = json.loads(hashes_text)
              except (TypeError, json.JSONDecodeError):
                  raise SystemExit("UX1_EXPECTED_EVIDENCE_HASHES must be a JSON object with all seven evidence hashes.")
              if (
                  not isinstance(hashes, dict)
                  or set(hashes) != expected_keys
                  or any(not isinstance(value, str) or not re.fullmatch(r"[a-f0-9]{64}", value) for value in hashes.values())
              ):
                  raise SystemExit("UX1_EXPECTED_EVIDENCE_HASHES must contain exactly seven lowercase SHA-256 hashes.")

              ux1_vars = {
                  "UX1_PREVIEW_MODE": mode,
                  "UX1_UES_REVISION": ues,
                  "UX1_RUNTIME_EPOCH": epoch,
                  "UX1_EXPECTED_EVIDENCE_HASHES": hashes_text,
              }
              vars_header = "[vars]\n"
              if vars_header not in text:
                  raise SystemExit("wrangler.toml.example must contain a [vars] section.")
              rendered_vars = "".join(f"{key} = {json.dumps(value)}\n" for key, value in ux1_vars.items())
              text = text.replace(vars_header, vars_header + rendered_vars, 1)
          target.write_text(text, encoding="utf-8")
          PY

