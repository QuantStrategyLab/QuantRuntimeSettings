        working-directory: web/strategy-switch-console
        run: |
          set -euo pipefail
          printf '%s' "$SCHWAB_ACCOUNT_FACTS_SYNC_TOKEN" | npx wrangler@4.106.0 secret put SCHWAB_ACCOUNT_FACTS_SYNC_TOKEN --config wrangler.toml

      - name: Sync optional Firstrade account-facts ingress token
        if: (github.event_name == 'workflow_dispatch' && inputs.sync_secrets) && (env.FIRSTRADE_ACCOUNT_FACTS_SYNC_TOKEN != '')
        working-directory: web/strategy-switch-console
        run: |
          set -euo pipefail
          printf '%s' "$FIRSTRADE_ACCOUNT_FACTS_SYNC_TOKEN" | npx wrangler@4.106.0 secret put FIRSTRADE_ACCOUNT_FACTS_SYNC_TOKEN --config wrangler.toml

      - name: Sync optional Binance account-facts credentials
        if: (github.event_name == 'workflow_dispatch' && inputs.sync_secrets) && (env.BINANCE_ACCOUNT_FACTS_SYNC_TOKEN != '')
        working-directory: web/strategy-switch-console
        run: |
          set -euo pipefail
          printf '%s' "$BINANCE_ACCOUNT_FACTS_SYNC_TOKEN" | npx wrangler@4.106.0 secret put BINANCE_ACCOUNT_FACTS_SYNC_TOKEN --config wrangler.toml
          printf '%s' "$BINANCE_ACCOUNT_FACTS_BINDING_JSON" | npx wrangler@4.106.0 secret put BINANCE_ACCOUNT_FACTS_BINDING_JSON --config wrangler.toml
          printf '%s' "$BINANCE_ACCOUNT_FACTS_HISTORY_BINDINGS_JSON" | npx wrangler@4.106.0 secret put BINANCE_ACCOUNT_FACTS_HISTORY_BINDINGS_JSON --config wrangler.toml

      - name: Sync M0 research-ledger ingress token
        if: github.event_name == 'workflow_dispatch' && inputs.sync_secrets
        env:
          M0_RESEARCH_SYNC_TOKEN: ${{ secrets.M0_RESEARCH_SYNC_TOKEN }}
        working-directory: web/strategy-switch-console
        run: |
          set -euo pipefail
          printf '%s' "$M0_RESEARCH_SYNC_TOKEN" | npx wrangler@4.106.0 secret put M0_RESEARCH_SYNC_TOKEN --config wrangler.toml

      - name: Wait for optional Binance account-facts readiness stability
        if: env.BINANCE_ACCOUNT_FACTS_SYNC_TOKEN != '' && !inputs.skip_binance_receiver_checks
        env:
          BINANCE_ACCOUNT_FACTS_DEPLOYMENT_READINESS: "true"
        run: node scripts/verify_binance_account_facts_receiver.mjs

      - name: Verify optional Binance account-facts receiver credentials
        if: env.BINANCE_ACCOUNT_FACTS_SYNC_TOKEN != '' && !inputs.skip_binance_receiver_checks
        run: node scripts/verify_binance_account_facts_receiver.mjs

      - name: Sync bundled strategy profiles to KV
        if: github.event_name == 'workflow_dispatch' && inputs.sync_strategy_profiles
        run: |
          set -euo pipefail
          if [ -z "${STRATEGY_SWITCH_CONSOLE_URL:-}" ]; then
            echo "STRATEGY_SWITCH_CONSOLE_URL is required to sync strategy profiles." >&2
            exit 2
          fi
          if [ -z "${STRATEGY_SWITCH_SYNC_TOKEN:-}" ]; then
            echo "STRATEGY_SWITCH_SYNC_TOKEN or RUNTIME_SETTINGS_GH_TOKEN is required to sync strategy profiles." >&2
            exit 2
          fi

          expected_profiles="$(mktemp)"
          sync_body="$(mktemp)"
          live_body="$(mktemp)"
          cleanup() { rm -f "$expected_profiles" "$sync_body" "$live_body"; }
          trap cleanup EXIT

          expected_count="$(python3 - "$expected_profiles" <<'PY'
          import json
          import sys
          from pathlib import Path

          profiles = json.loads(Path("web/strategy-switch-console/strategy-profiles.example.json").read_text())
          if not isinstance(profiles, list):
              raise SystemExit("strategy-profiles.example.json must contain a JSON list")
          catalog_fields = (
              "profile",
              "runtime_enabled",
              "lifecycle_stage",
              "can_switch_live",
              "allowed_execution_modes",
              "blocked_live_reason",
          )

          def project(item):
              projected = {field: item.get(field) for field in catalog_fields}
              projected["lifecycle_stage"] = projected["lifecycle_stage"] or ""
              projected["allowed_execution_modes"] = projected["allowed_execution_modes"] or []
              projected["blocked_live_reason"] = projected["blocked_live_reason"] or ""
              return projected

          expected_profiles = sorted((project(item) for item in profiles), key=lambda item: item["profile"])
          Path(sys.argv[1]).write_text(
              json.dumps(expected_profiles, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          print(len(expected_profiles))
          PY
          )"

          for attempt in 1 2 3 4 5 6; do
            curl --fail --show-error --silent \
              --request POST \
              --header "Authorization: Bearer ${STRATEGY_SWITCH_SYNC_TOKEN}" \
              --header "Content-Type: application/json" \
              --header "Cache-Control: no-cache" \
              --data '{"source":"github-actions"}' \
              --output "$sync_body" \
              "${STRATEGY_SWITCH_CONSOLE_URL%/}/api/internal/sync-strategy-profiles"
            python3 -m json.tool "$sync_body"

            curl --fail --show-error --silent \
              --header "Cache-Control: no-cache" \
              --header "Pragma: no-cache" \
              --output "$live_body" \
              "${STRATEGY_SWITCH_CONSOLE_URL%/}/api/strategy-profiles?catalog_readback=${GITHUB_SHA}-${attempt}-$(date +%s%N)"
            if live_digest="$(python3 - "$expected_profiles" "$live_body" <<'PY'
          import hashlib
          import json
          import sys

          expected_profiles = json.load(open(sys.argv[1], encoding="utf-8"))
          payload = json.load(open(sys.argv[2], encoding="utf-8"))
          profiles = payload.get("strategyProfiles")
          if not isinstance(profiles, list):
              raise SystemExit("/api/strategy-profiles did not return strategyProfiles list")
          catalog_fields = (
              "profile",
              "runtime_enabled",
              "lifecycle_stage",
              "can_switch_live",
              "allowed_execution_modes",
              "blocked_live_reason",
          )

          def project(item):
              projected = {field: item.get(field) for field in catalog_fields}
              projected["lifecycle_stage"] = projected["lifecycle_stage"] or ""
              projected["allowed_execution_modes"] = projected["allowed_execution_modes"] or []
              projected["blocked_live_reason"] = projected["blocked_live_reason"] or ""
              return projected

          actual_profiles = sorted((project(item) for item in profiles), key=lambda item: item["profile"])
          if actual_profiles != expected_profiles:
              expected_by_profile = {item["profile"]: item for item in expected_profiles}
              actual_by_profile = {item["profile"]: item for item in actual_profiles}
              changed_profiles = sorted(
                  profile
                  for profile in expected_by_profile.keys() | actual_by_profile.keys()
                  if expected_by_profile.get(profile) != actual_by_profile.get(profile)
              )
              print(
                  "Live strategy profile catalog mismatch for: " + ", ".join(changed_profiles or ["unknown"]),
                  file=sys.stderr,
              )
              raise SystemExit(1)
          canonical = json.dumps(actual_profiles, ensure_ascii=False, separators=(",", ":"))
          print(hashlib.sha256(canonical.encode("utf-8")).hexdigest())
          PY
            )"; then
              echo "Strategy profile KV sync verified with $expected_count profiles (catalog sha256: $live_digest)."
              break
            fi
            if [ "$attempt" = "6" ]; then
              echo "Live strategy profile catalog did not match the expected $expected_count-profile payload." >&2
              exit 2
            fi
            echo "Live strategy profile catalog is stale. Waiting for deployed Worker propagation..." >&2
            sleep 5
          done

  rollback:
    if: github.event_name == 'workflow_dispatch' && !inputs.read_only_preflight && inputs.rollback_to_pre_release
    runs-on: ubuntu-latest
    environment: runtime-strategy-switch
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_FRONTEND_ASSETS: ${{ inputs.release_frontend_assets }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Restore fixed pre-release Worker version
        env:
          ROLLBACK_VERSION: ${{ inputs.rollback_version }}
        run: |
          node --input-type=module <<'JS'
          // One fixed deployment request. In particular, never retry with force:
          // Wrangler 4.106.0 rollback can implicitly do that after API error 10220.
          // https://developers.cloudflare.com/api/resources/workers/subresources/scripts/subresources/deployments/methods/create/
          const target = process.env.ROLLBACK_VERSION || '2beea000-cce5-43a5-9255-9724f7318e83';
          const fe11 = target === 'c8dc4852-fa9d-4d14-bca3-7941587a494f';
          const dailyRestore = target === '06043e24-f8c9-4129-8c59-abb9957217bf';
          const fail = () => { throw new Error('console_restore_failed'); };
          let stage = 'configuration';
          let httpStatus = null;
          let requested = false;
          try {
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            if (process.env.GITHUB_REF !== 'refs/heads/main' || process.env.RELEASE_SOURCE_SHA || process.env.RELEASE_FRONTEND_ASSETS === 'true'
              || (!fe11 && !dailyRestore && target !== '2beea000-cce5-43a5-9255-9724f7318e83')
              || !token || !/^[0-9a-f]{32}$/i.test(account ?? '')) fail();
            const base = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/qsl-strategy-switch-console`;
            async function request(path, method = 'GET', payload) {
              const response = await fetch(base + path, {
                method, redirect: 'error', signal: AbortSignal.timeout(15000),
                headers: { Authorization: `Bearer ${token}`, Accept: 'application/json', 'Accept-Encoding': 'identity', ...(payload ? { 'Content-Type': 'application/json' } : {}) },
                body: payload,
              });
              httpStatus = Number.isInteger(response.status) && response.status >= 100 && response.status <= 599 ? response.status : null;
              stage = 'http_status';
              if (!response.ok) { await response.body?.cancel(); fail(); }
              stage = 'response_bounds';
              if (!/^application\/json(?:\s*;|$)/i.test(response.headers.get('content-type') ?? '')
                || !['', 'identity'].includes(response.headers.get('content-encoding') ?? '')) fail();
              const length = response.headers.get('content-length');
              if (length !== null && (!/^\d+$/.test(length) || Number(length) > 65536)) fail();
              const reader = response.body?.getReader();
              if (!reader) fail();
              const decoder = new TextDecoder('utf-8', { fatal: true });
              let size = 0, text = '';
              try {
                for (;;) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  size += value.byteLength;
                  if (size > 65536) fail();
                  text += decoder.decode(value, { stream: true });
                }
                text += decoder.decode();
              } finally { await reader.cancel(); }
              if (length !== null && size !== Number(length)) fail();
              stage = 'response_schema';
              const body = JSON.parse(text);
              if (body?.success !== true || (body.errors != null && (!Array.isArray(body.errors) || body.errors.length))) fail();
              return body.result;
            }
            if (fe11 || dailyRestore) {
              stage = 'target_readback';
              if ((await request(`/versions/${target}`))?.id !== target) fail();
            }
            if (dailyRestore) {
              const expectedVersion = '26996cc3-732a-4774-af02-b46842913d36';
              const expectedDeployment = '62ff9408-050a-442a-afa9-884405132768';
              const currentIsExpected = async () => {
                const current = (await request('/deployments?page=1&per_page=10'))?.deployments;
                if (!Array.isArray(current) || !current.length || current.length > 10 || current[0]?.id !== expectedDeployment
                  || current[0]?.strategy !== 'percentage' || !Array.isArray(current[0]?.versions)
                  || current[0].versions.length !== 1 || current[0].versions[0]?.version_id !== expectedVersion
                  || current[0].versions[0]?.percentage !== 100) fail();
              };
              stage = 'active_before_restore'; await currentIsExpected();
              stage = 'version_lineage';
              const items = (await request('/versions?page=1&per_page=10'))?.items;
              if (!Array.isArray(items) || items.length < 2 || items.length > 10
                || items[0]?.id !== expectedVersion || items[1]?.id !== target) fail();
              stage = 'active_before_request'; await currentIsExpected();
            }
            stage = 'request'; requested = true;
            const result = await request('/deployments?force=false', 'POST', JSON.stringify({ strategy: 'percentage',
              versions: [{ version_id: target, percentage: 100 }], annotations: { 'workers/message': fe11
                ? 'Restore verified FE-RELEASE-11 c8dc4852 baseline' : dailyRestore
                  ? 'Restore previous website version 06043e24 after daily release regression' : 'Restore verified pre-frontend 2beea000 baseline' } }));
            if (typeof result?.id !== 'string' || !/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(result.id)
              || ((!(fe11 || dailyRestore) || Object.hasOwn(result, 'strategy')) && result.strategy !== 'percentage')
              || ((!(fe11 || dailyRestore) || Object.hasOwn(result, 'versions')) && (!Array.isArray(result.versions) || result.versions.length !== 1
                || result.versions[0]?.version_id !== target || result.versions[0]?.percentage !== 100))) fail();
            if (fe11 || dailyRestore) {
              stage = 'active_readback';
              const current = (await request('/deployments?page=1&per_page=10'))?.deployments;
              if (!Array.isArray(current) || !current.length || current.length > 10 || current[0]?.id !== result.id
                || current[0]?.strategy !== 'percentage' || !Array.isArray(current[0]?.versions) || current[0].versions.length !== 1
                || current[0].versions[0]?.version_id !== target || current[0].versions[0]?.percentage !== 100) fail();
            }
            console.log(JSON.stringify({ status: 'restore_response_verified', deployment_id: result.id, version_id: target, percentage: 100, force: false }));
          } catch {
            // A failed/unknown response after POST may follow a committed change.
            // No automatic retry and no provider body, identity or error text.
            console.error(JSON.stringify({ error: 'console_restore_failed', stage, http_status: httpStatus,
              outcome: requested ? 'UNKNOWN_REQUIRES_READBACK' : 'NOT_ATTEMPTED', retry: false }));
            process.exitCode = 1;
          }
          JS
