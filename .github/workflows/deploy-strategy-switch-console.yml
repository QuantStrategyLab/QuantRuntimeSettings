name: Deploy Strategy Switch Console

on:
  workflow_dispatch:
    inputs:
      sync_secrets:
        description: "After deploy, synchronize Worker secrets. Disable to retain deployed secrets."
        required: true
        type: boolean
        default: false
      sync_strategy_profiles:
        description: "After deploy, write the bundled strategy profile catalog to KV."
        required: true
        type: boolean
        default: false
      read_only_preflight:
        description: "Read deployment/version metadata only. Do not deploy or synchronize anything."
        required: true
        type: boolean
        default: false
      diagnose_restore_target:
        description: "Read fixed restore target response metadata during read-only preflight."
        required: true
        type: boolean
        default: false
      skip_binance_receiver_checks:
        description: "Skip only Binance readiness GETs and receiver-credential POST; retain all other checks."
        required: true
        type: boolean
        default: false
      source_sha:
        description: "Select a fixed reviewed website release source."
        required: false
        type: string
        default: ""
      release_frontend_assets:
        description: "Release fixed reviewed website code and frontend assets while retaining live configuration. No secret/profile sync."
        required: true
        type: boolean
        default: false
      rollback_to_pre_release:
        description: "Restore only the selected fixed baseline (legacy or FE-RELEASE-11); never build or sync. Read-only mode takes priority."
        required: true
        type: boolean
        default: false
      rollback_version:
        description: "Exact existing version to restore when rollback_to_pre_release is true. Never rebuild or force."
        required: true
        type: choice
        default: "2beea000-cce5-43a5-9255-9724f7318e83"
        options:
          - "2beea000-cce5-43a5-9255-9724f7318e83"
          - "c8dc4852-fa9d-4d14-bca3-7941587a494f"
          - "06043e24-f8c9-4129-8c59-abb9957217bf"

permissions:
  contents: read

concurrency:
  group: strategy-switch-console-deploy
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.read_only_preflight
    runs-on: ubuntu-latest
    environment: runtime-strategy-switch
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Read bounded Worker version metadata
        run: |
          node --input-type=module <<'JS'
          // Same deployment identity, fixed API host/Worker, GET only, first page only.
          // Native API avoids CLI telemetry, credential discovery and raw CLI logs.
          // https://developers.cloudflare.com/api/resources/workers/subresources/scripts/subresources/deployments/methods/list/
          // https://developers.cloudflare.com/api/resources/workers/subresources/scripts/subresources/versions/methods/list/
          const fail = () => { throw new Error('worker_preflight_failed'); };
          const uuid = value => typeof value === 'string' && /^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(value) ? value : fail();
          const time = value => {
            // date-time permits explicit offsets. Validate the local calendar too:
            // Date.parse alone normalizes invalid dates such as February 30.
            const match = typeof value === 'string' && /^(\d{4}-\d{2}-\d{2})[Tt](\d{2}:\d{2}:\d{2})(?:\.\d{1,9})?([Zz]|[+-]\d{2}:\d{2})$/.exec(value);
            if (!match) fail();
            const wall = `${match[1]}T${match[2]}Z`;
            const offset = match[3];
            if (!Number.isFinite(Date.parse(wall)) || new Date(wall).toISOString().slice(0, 19) !== wall.slice(0, 19)
              || (offset.length > 1 && (Number(offset.slice(1, 3)) > 23 || Number(offset.slice(4)) > 59))
              || !Number.isFinite(Date.parse(value.toUpperCase()))) fail();
            return value; // Do not truncate fractional precision or rewrite the offset.
          };
          const list = (value, minimum = 0) => Array.isArray(value) && value.length >= minimum && value.length <= 10 ? value : fail();
          const distinct = values => new Set(values).size === values.length || fail();
          // Only fixed schema names, types and bounded counts. Never emit unknown
          // key names: even a JSON key can contain account data or a credential.
          const shape = (value, keys = []) => {
            const type = value === null ? 'null' : Array.isArray(value) ? 'array' : typeof value;
            if (type === 'array') return { type, count: Math.min(value.length, 11) };
            if (type !== 'object') return { type };
            const fields = {};
            for (const key of keys) if (Object.hasOwn(value, key)) fields[key] = shape(value[key]);
            return { type, fields, other_key_count: Math.min(Object.keys(value).length - Object.keys(fields).length, 11) };
          };
          let stage = 'configuration';
          let httpStatus = null;
          let checkpoint = 'configuration';
          let responseShape = {};
          try {
            const token = process.env.CLOUDFLARE_API_TOKEN;
            const account = process.env.CLOUDFLARE_ACCOUNT_ID;
            if (!token || !/^[0-9a-f]{32}$/i.test(account ?? '')) fail();
            const worker = 'qsl-strategy-switch-console';
            const base = `https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${worker}`;
            async function read(endpoint) {
              stage = endpoint;
              httpStatus = null;
              checkpoint = 'request';
              responseShape = {};
              const response = await fetch(`${base}/${endpoint}?page=1&per_page=10`, {
                method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
                headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
              });
              httpStatus = Number.isInteger(response.status) && response.status >= 100 && response.status <= 599 ? response.status : null;
              checkpoint = 'http_status';
              if (!response.ok) {
                await response.body?.cancel();
                fail();
              }
              checkpoint = 'response_content_type';
              if (!/^application\/json(?:\s*;|$)/i.test(response.headers.get('content-type') ?? '')) {
                await response.body?.cancel();
                fail();
              }
              checkpoint = 'response_body';
              const reader = response.body.getReader();
              const chunks = [];
              let length = 0;
              try {
                for (;;) {
                  const { value, done } = await reader.read();
                  if (done) break;
                  length += value.byteLength;
                  if (length > 65536) { checkpoint = 'response_size'; await reader.cancel(); fail(); }
                  chunks.push(value);
                }
              } finally { reader.releaseLock(); }
              checkpoint = 'response_utf8';
              const text = new TextDecoder('utf-8', { fatal: true }).decode(Buffer.concat(chunks));
              checkpoint = 'response_json';
              const body = JSON.parse(text);
              responseShape.envelope = shape(body, ['success', 'result', 'errors', 'messages']);
              checkpoint = 'envelope_success';
              if (body?.success !== true) fail();
              responseShape.result = shape(body.result, ['deployments', 'items']);
              return body.result;
            }
            // The first deployment is actively serving traffic (provider contract).
            const deploymentResult = await read('deployments');
            checkpoint = 'deployments_list';
            const deployments = list(deploymentResult?.deployments, 1).map(item => {
              responseShape.entry = shape(item, ['id', 'created_on', 'versions']);
              checkpoint = 'deployment_versions';
              const versions = list(item?.versions, 1).map(entry => {
                responseShape.version_entry = shape(entry, ['version_id', 'percentage']);
                checkpoint = 'deployment_percentage';
                if (!entry) fail();
                // Wrangler 4.106.0 permits an idle version at 0%; retain it.
                // Every weight remains finite/in-range and the total must be 100.
                if (!Number.isFinite(entry.percentage) || entry.percentage < 0 || entry.percentage > 100) fail();
                checkpoint = 'deployment_version_id';
                return { version_id: uuid(entry.version_id), percentage: entry.percentage };
              });
              checkpoint = 'deployment_version_duplicate';
              distinct(versions.map(entry => entry.version_id));
              checkpoint = 'deployment_percentage_total';
              if (Math.abs(versions.reduce((sum, entry) => sum + entry.percentage, 0) - 100) > 0.000001) fail();
              checkpoint = 'deployment_id';
              const id = uuid(item.id);
              checkpoint = 'deployment_time';
              return { id, created_on: time(item.created_on), versions };
            });
            checkpoint = 'deployment_duplicate';
            distinct(deployments.map(item => item.id));
            // Do not use deployable=true: that API option ignores pagination.
            const versionResult = await read('versions');
            checkpoint = 'versions_list';
            const versions = list(versionResult?.items).map(item => {
              responseShape.entry = shape(item, ['id', 'metadata']);
              responseShape.metadata = shape(item?.metadata, ['created_on']);
              checkpoint = 'version_id';
              const id = uuid(item?.id);
              checkpoint = 'version_time';
              return { id, created_on: time(item.metadata?.created_on) };
            });
            checkpoint = 'version_duplicate';
            distinct(versions.map(item => item.id));
            console.log(JSON.stringify({
              ok: true, worker, read_only: true, active: deployments[0],
              recent_deployments: deployments, recent_versions: versions,
              active_versions_in_first_version_page: deployments[0].versions.every(active => versions.some(item => item.id === active.version_id)),
              rollback_compatibility: 'NOT_VERIFIED', next_pages_read: false,
            }));
          } catch {
            // Never print provider bodies, author/config fields, auth or exception text.
            console.error(JSON.stringify({ ok: false, error: 'worker_preflight_failed', stage, http_status: httpStatus,
              checkpoint, response_shape: responseShape }));
            process.exitCode = 1;
          }
          JS

      - name: Read fixed frontend baseline schema categories
        if: inputs.release_frontend_assets
        run: |
          node --input-type=module <<'JS'
          // Read-only diagnostic: keys, types and counts only. Never binding names,
          // values, raw errors, credentials or response bodies. One fixed GET.
          const fail = () => { throw new Error('frontend_schema_readback_failed'); };
          let httpStatus = null;
          try {
            const account = process.env.CLOUDFLARE_ACCOUNT_ID, token = process.env.CLOUDFLARE_API_TOKEN;
            if (process.env.GITHUB_REF !== 'refs/heads/main' || !token || !/^[0-9a-f]{32}$/i.test(account ?? '')) fail();
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/qsl-strategy-switch-console/versions/2beea000-cce5-43a5-9255-9724f7318e83`, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json', 'Accept-Encoding': 'identity' },
            });
            httpStatus = response.status;
            if (!response.ok) { await response.body?.cancel(); fail(); }
            if (!/^application\/json(?:\s*;|$)/i.test(response.headers.get('content-type') ?? '') || !['', 'identity'].includes(response.headers.get('content-encoding') ?? '')) fail();
            const length = response.headers.get('content-length');
            if (length !== null && (!/^\d+$/.test(length) || Number(length) > 524288)) fail();
            const reader = response.body?.getReader(); if (!reader) fail();
            let size = 0, text = ''; const decoder = new TextDecoder('utf-8', { fatal: true });
            try {
              for (;;) { const { done, value } = await reader.read(); if (done) break; size += value.byteLength; if (size > 524288) fail(); text += decoder.decode(value, { stream: true }); }
              text += decoder.decode();
            } finally { await reader.cancel(); }
            if (length !== null && Number(length) !== size) fail();
            const body = JSON.parse(text);
            if (body?.success !== true || (body.errors !== undefined && (!Array.isArray(body.errors) || body.errors.length))) fail();
            const kind = x => x === null ? 'null' : Array.isArray(x) ? 'array' : typeof x;
            const keys = ['resources','metadata','number','annotations','startup_time_ms','bindings','script','script_runtime','etag','handlers','named_handlers','last_deployed_from','placement_mode','compatibility_date','compatibility_flags','usage_model','limits','migration_tag','exports','name','type','namespace_id','class_name','script_name','environment','text','json','dispatch_namespace','id','raw','tag','version_id','secret_name','store_id'];
            const shape = x => {
              if (!x || kind(x) !== 'object') return { kind: kind(x) };
              const entries = Object.entries(x); if (entries.length > 128) fail();
              return { kind: 'object', fields: Object.fromEntries(entries.filter(([k]) => keys.includes(k)).map(([k,v]) => [k,kind(v)])), unknown_fields: entries.filter(([k]) => !keys.includes(k)).length };
            };
            const resources = body.result?.resources, bindings = resources?.bindings;
            const categories = [];
            const types = ['plain_text','json','secret_text','kv_namespace','durable_object_namespace','service','r2_bucket','d1','ai','browser','analytics_engine','version_metadata','secret_key','secrets_store_secret','queue','workflow','assets'];
            if (Array.isArray(bindings)) {
              if (bindings.length > 128) fail();
              for (const binding of bindings) {
                const type = types.includes(binding?.type) ? binding.type : 'OTHER';
                const fields = shape(binding); const signature = JSON.stringify({ type, shape: fields });
                const found = categories.find(item => item.signature === signature);
                if (found) found.count++; else categories.push({ signature, type, shape: fields, count: 1 });
              }
            }
            // Fixed booleans identify the rejecting contract without revealing
            // configuration values, binding identities or arbitrary field names.
            const runtime = resources?.script_runtime, script = resources?.script;
            const object = x => !!x && kind(x) === 'object';
            const only = (x, keys) => object(x) && Object.keys(x).every(key => keys.includes(key));
            const identifier = x => typeof x === 'string' && /^[A-Za-z_$][A-Za-z0-9_$]{0,127}$/.test(x);
            const bindingName = x => typeof x === 'string' && /^[A-Za-z_][A-Za-z0-9_]{0,127}$/.test(x);
            const hex = x => typeof x === 'string' && /^[0-9a-f]{32}$/i.test(x);
            const bounded = (x, n) => typeof x === 'string' && !!x && x.length <= n;
            const list = Array.isArray(bindings) && bindings.length > 0 && bindings.length <= 128 ? bindings : null;
            const all = check => !!list && list.every(check);
            const named = script?.named_handlers;
            // Each valid identifier needs at least three JSON bytes (quotes
            // plus one character). The existing 512 KiB response cap therefore
            // bounds this list without inventing a provider limit of 32 items.
            const handlerEntryLimit = Math.floor(524288 / 3);
            const namedList = Array.isArray(named) && named.length <= 128 ? named : null;
            const namedCategories = [];
            if (namedList) for (const item of namedList) {
              const fields = shape(item), signature = JSON.stringify(fields);
              const found = namedCategories.find(entry => entry.signature === signature);
              if (found) found.count++; else namedCategories.push({ signature, shape: fields, count: 1 });
            }
            const contracts = {
              resources_keys: only(resources, ['bindings','script','script_runtime']),
              runtime_keys: only(runtime, ['compatibility_date','compatibility_flags','usage_model','limits','migration_tag','exports']),
              script_keys: only(script, ['etag','handlers','named_handlers','last_deployed_from','placement_mode']),
              binding_list_bounds: !!list,
              etag_bounds: bounded(script?.etag, 256),
              default_handlers: script?.handlers === null || (Array.isArray(script?.handlers) && script.handlers.every(x => typeof x === 'string')),
              date_ymd: typeof runtime?.compatibility_date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(runtime.compatibility_date),
              date_midnight_utc: typeof runtime?.compatibility_date === 'string' && /^\d{4}-\d{2}-\d{2}T00:00:00(?:\.0{1,3})?Z$/.test(runtime.compatibility_date),
              compatibility_flags: runtime?.compatibility_flags === undefined || (Array.isArray(runtime.compatibility_flags) && runtime.compatibility_flags.every(x => typeof x === 'string')),
              usage_model: ['standard','bundled','unbound'].includes(runtime?.usage_model),
              named_handlers: named === undefined || (Array.isArray(named) && named.length <= 128 && named.every(item => only(item,['name','handlers']) && identifier(item.name) && (item.handlers === undefined || (Array.isArray(item.handlers) && item.handlers.length <= handlerEntryLimit && item.handlers.every(identifier)))) && new Set(named.map(item => item.name)).size === named.length),
              named_list_bounds: named === undefined || !!namedList,
              named_item_keys: named === undefined || (!!namedList && namedList.every(item => only(item,['name','handlers']))),
              named_name_format: named === undefined || (!!namedList && namedList.every(item => identifier(item?.name))),
              named_names_unique: named === undefined || (!!namedList && new Set(namedList.map(item => item?.name)).size === namedList.length),
              named_handler_list_bounds: named === undefined || (!!namedList && namedList.every(item => item?.handlers === undefined || (Array.isArray(item.handlers) && item.handlers.length <= handlerEntryLimit))),
              named_handler_identifiers: named === undefined || (!!namedList && namedList.every(item => item?.handlers === undefined || (Array.isArray(item.handlers) && item.handlers.every(identifier)))),
              binding_names: all(b => object(b) && bindingName(b.name)),
              binding_names_unique: !!list && new Set(list.map(b => b?.name)).size === list.length,
              binding_types: all(b => ['plain_text','json','secret_text','kv_namespace','durable_object_namespace'].includes(b?.type)),
              kv_namespace_hex: all(b => b?.type !== 'kv_namespace' || hex(b.namespace_id)),
              do_namespace_hex: all(b => b?.type !== 'durable_object_namespace' || hex(b.namespace_id)),
              do_class_name: all(b => b?.type !== 'durable_object_namespace' || identifier(b.class_name)),
              do_optional_references: all(b => b?.type !== 'durable_object_namespace' || ['script_name','environment','dispatch_namespace'].every(key => b[key] === undefined || bounded(b[key],128))),
              plain_text_bounds: all(b => b?.type !== 'plain_text' || (typeof b.text === 'string' && b.text.length <= 131072)),
              json_present: all(b => b?.type !== 'json' || Object.hasOwn(b,'json')),
              secret_shape: all(b => b?.type !== 'secret_text' || only(b,['name','type'])),
              required_kv: !!list && list.some(b => b?.name === 'STRATEGY_SWITCH_CONFIG' && b.type === 'kv_namespace'),
              required_do: !!list && list.some(b => b?.name === 'STRATEGY_SWITCH_RUNTIME_INSTANCES' && b.type === 'durable_object_namespace'),
            };
            console.log(JSON.stringify({ status: 'frontend_schema_categories', version_id: '2beea000-cce5-43a5-9255-9724f7318e83', result_id_matches: body.result?.id === '2beea000-cce5-43a5-9255-9724f7318e83', result: shape(body.result), resources: shape(resources),
              binding_container: kind(bindings), binding_count: Array.isArray(bindings) ? bindings.length : null,
              binding_categories: categories.map(({ signature, ...item }) => item), script: shape(resources?.script), runtime: shape(resources?.script_runtime), contracts,
              named_handler_categories: namedCategories.map(({ signature, ...item }) => item),
              named_handler_max_entries: namedList ? Math.max(0, ...namedList.map(item => Array.isArray(item?.handlers) ? item.handlers.length : 0)) : null,
              writes: 0, retry: false }));
          } catch {
            console.error(JSON.stringify({ error: 'frontend_schema_readback_failed', http_status: httpStatus, writes: 0, retry: false })); process.exitCode = 1;
          }
          JS


      - name: Diagnose fixed restore target response metadata
        if: inputs.diagnose_restore_target
        run: |
          node --input-type=module <<'JS'
          const result = { status: null, content_type: null, content_encoding: null, declared_length: null,
            actual_bytes: 0, category: null, writes: 0 };
          try {
            const token = process.env.CLOUDFLARE_API_TOKEN, account = process.env.CLOUDFLARE_ACCOUNT_ID;
            if (!token || !/^[0-9a-f]{32}$/i.test(account ?? '')) throw Error('config');
            const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/qsl-strategy-switch-console/versions/06043e24-f8c9-4129-8c59-abb9957217bf`, {
              method: 'GET', redirect: 'error', signal: AbortSignal.timeout(15000),
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/json' },
            });
            result.status = response.status;
            const type = response.headers.get('content-type');
            result.content_type = type === null ? 'missing' : /^application\/json(?:\s*;|$)/i.test(type) ? 'json' : 'other';
            const encoding = response.headers.get('content-encoding');
            result.content_encoding = encoding === null ? 'missing' : encoding === 'identity' ? 'identity' : encoding === 'gzip' ? 'gzip' : encoding === 'br' ? 'br' : 'other';
            const length = response.headers.get('content-length');
            result.declared_length = length === null ? null : /^\d+$/.test(length) && Number.isSafeInteger(Number(length)) ? Number(length) : 'invalid';
            if (!response.body) { result.category = 'no_body'; }
            else {
              const reader = response.body.getReader();
              try {
                for (;;) {
                  const { value, done } = await reader.read(); if (done) break;
                  result.actual_bytes += value.byteLength;
                  if (result.actual_bytes > 1048576) { result.category = 'over_1mib'; break; }
                }
              } finally { await reader.cancel(); }
            }
            if (!result.category) result.category = result.actual_bytes > 65536 ? 'over_64k' : 'within_64k';
          } catch { result.category = 'request_or_stream_failed'; }
          console.log(JSON.stringify(result));
          JS

  deploy:
    if: github.event_name == 'workflow_dispatch' && !inputs.read_only_preflight && !inputs.rollback_to_pre_release
    runs-on: ubuntu-latest
    environment: runtime-strategy-switch
    timeout-minutes: 25
    env:
      WORKER_DIR: web/strategy-switch-console
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WRANGLER_CONFIG_TOML: ${{ secrets.CLOUDFLARE_WRANGLER_CONFIG_TOML }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID: ${{ secrets.STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID || vars.STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID }}
      STRATEGY_SWITCH_CONSOLE_URL: ${{ vars.STRATEGY_SWITCH_CONSOLE_URL }}
      UX1_PREVIEW_MODE: ${{ vars.UX1_PREVIEW_MODE }}
      UX1_UES_REVISION: ${{ vars.UX1_UES_REVISION }}
      UX1_RUNTIME_EPOCH: ${{ vars.UX1_RUNTIME_EPOCH }}
      UX1_EXPECTED_EVIDENCE_HASHES: ${{ vars.UX1_EXPECTED_EVIDENCE_HASHES }}
      ACCOUNT_FACTS_READ_MODEL_ENABLED: ${{ vars.ACCOUNT_FACTS_READ_MODEL_ENABLED }}
      RUNTIME_DAILY_READ_MODEL_ENABLED: ${{ vars.RUNTIME_DAILY_READ_MODEL_ENABLED }}
      STRATEGY_SWITCH_SYNC_TOKEN: ${{ secrets.STRATEGY_SWITCH_SYNC_TOKEN || secrets.RUNTIME_SETTINGS_GH_TOKEN }}
      STRATEGY_HEALTH_SYNC_TOKEN: ${{ secrets.STRATEGY_HEALTH_SYNC_TOKEN }}
      CONTROL_PLANE_SYNC_TOKEN: ${{ secrets.CONTROL_PLANE_SYNC_TOKEN }}
      AAB_VALIDATION_SYNC_TOKEN: ${{ secrets.AAB_VALIDATION_SYNC_TOKEN }}
      RESEARCH_TASK_SYNC_TOKEN: ${{ secrets.RESEARCH_TASK_SYNC_TOKEN }}
      RESEARCH_PROMOTION_SYNC_TOKEN: ${{ secrets.RESEARCH_PROMOTION_SYNC_TOKEN }}
      EXECUTION_EVIDENCE_SYNC_TOKEN: ${{ secrets.EXECUTION_EVIDENCE_SYNC_TOKEN }}
      RECONCILIATION_RECOVERY_SYNC_TOKEN: ${{ secrets.RECONCILIATION_RECOVERY_SYNC_TOKEN }}
      RECONCILIATION_RECOVERY_CONTROLLER_TOKEN: ${{ secrets.RECONCILIATION_RECOVERY_CONTROLLER_TOKEN }}
      ACCOUNT_FACTS_SYNC_TOKEN: ${{ secrets.ACCOUNT_FACTS_SYNC_TOKEN }}
      IBKR_ACCOUNT_FACTS_SYNC_TOKEN: ${{ secrets.IBKR_ACCOUNT_FACTS_SYNC_TOKEN }}
      SCHWAB_ACCOUNT_FACTS_SYNC_TOKEN: ${{ secrets.SCHWAB_ACCOUNT_FACTS_SYNC_TOKEN }}
      FIRSTRADE_ACCOUNT_FACTS_SYNC_TOKEN: ${{ secrets.FIRSTRADE_ACCOUNT_FACTS_SYNC_TOKEN }}
      BINANCE_ACCOUNT_FACTS_SYNC_TOKEN: ${{ secrets.BINANCE_ACCOUNT_FACTS_SYNC_TOKEN }}
      BINANCE_ACCOUNT_FACTS_BINDING_JSON: ${{ secrets.BINANCE_ACCOUNT_FACTS_BINDING_JSON }}
      BINANCE_ACCOUNT_FACTS_HISTORY_BINDINGS_JSON: ${{ secrets.BINANCE_ACCOUNT_FACTS_HISTORY_BINDINGS_JSON || '[]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select reviewed historical main source
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_FRONTEND_ASSETS: ${{ inputs.release_frontend_assets }}
          SYNC_SECRETS: ${{ inputs.sync_secrets }}
          SYNC_STRATEGY_PROFILES: ${{ inputs.sync_strategy_profiles }}
          SKIP_BINANCE_RECEIVER_CHECKS: ${{ inputs.skip_binance_receiver_checks }}
        run: |
          set -euo pipefail
          frontend_mode="${RELEASE_FRONTEND_ASSETS:-false}"
          case "$frontend_mode" in true|false) ;; *) exit 2 ;; esac
          if [ "$RELEASE_SOURCE_SHA" = "aaa46a811a7cfa863f90261d516b197e5e554779" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$frontend_mode" != "true" ] \
              || [ "$SYNC_SECRETS" != "false" ] || [ "$SYNC_STRATEGY_PROFILES" != "false" ] \
              || [ "$SKIP_BINANCE_RECEIVER_CHECKS" != "true" ]; then
              echo "invalid_ibkr_daily_release_mode" >&2
              exit 2
            fi
            control_sha="$(git rev-parse HEAD)"
            [ "$control_sha" = "$GITHUB_SHA" ] || exit 2
            git merge-base --is-ancestor 9722414a99298cd7079a88eb8e3e703d50e986de "$control_sha"
            git cat-file -e "${RELEASE_SOURCE_SHA}^{commit}"
            [ "$(git rev-parse "${RELEASE_SOURCE_SHA}^" )" = "9722414a99298cd7079a88eb8e3e703d50e986de" ] || exit 2
            [ "$(git rev-parse "${RELEASE_SOURCE_SHA}^{tree}")" = "3ac93c0b2caf30a650ab46d4bf62220e45582a46" ] || exit 2
            [ "$(git rev-parse "${RELEASE_SOURCE_SHA}:web/strategy-switch-console/v2_asset_map.js")" = "c73e59a6fb22ab612251d331bdd4db5d9ae68b7a" ] || exit 2
            git -c advice.detachedHead=false checkout --detach "$RELEASE_SOURCE_SHA"
            [ "$(git rev-parse HEAD)" = "$RELEASE_SOURCE_SHA" ] || exit 2
            exit 0
          fi
          if [ "$RELEASE_SOURCE_SHA" = "20dad166be317dd0d57e492ed06e56dfb82b7aef" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$frontend_mode" != "true" ] \
              || [ "$SYNC_SECRETS" != "false" ] || [ "$SYNC_STRATEGY_PROFILES" != "false" ] \
              || [ "$SKIP_BINANCE_RECEIVER_CHECKS" != "true" ]; then
              echo "invalid_pr764_release_mode" >&2
              exit 2
            fi
            control_sha="$(git rev-parse HEAD)"
            if [ "$control_sha" != "$GITHUB_SHA" ]; then exit 2; fi
            git cat-file -e "${RELEASE_SOURCE_SHA}^{commit}"
            git merge-base --is-ancestor "$RELEASE_SOURCE_SHA" "$control_sha"
            expected_tree="7db7dbd1b1749b42187dbc1c9658669fa426ffa6"
            if [ "$(git rev-parse "${RELEASE_SOURCE_SHA}^{tree}")" != "$expected_tree" ] \
              || [ "$(git rev-parse "${RELEASE_SOURCE_SHA}:web/strategy-switch-console/v2_asset_map.js")" != "de87e1c1c6b62fa94bd514c8936a4ec32e14c0e4" ]; then
              echo "pr764_release_source_mismatch" >&2
              exit 2
            fi
            git -c advice.detachedHead=false checkout --detach "$RELEASE_SOURCE_SHA"
            if [ "$(git rev-parse HEAD)" != "$RELEASE_SOURCE_SHA" ] || [ "$(git rev-parse 'HEAD^{tree}')" != "$expected_tree" ]; then exit 2; fi
            exit 0
          fi
          if [ "$frontend_mode" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$RELEASE_SOURCE_SHA" != "9722414a99298cd7079a88eb8e3e703d50e986de" ] \
              || [ "$SYNC_SECRETS" != "false" ] || [ "$SYNC_STRATEGY_PROFILES" != "false" ] \
              || [ "$SKIP_BINANCE_RECEIVER_CHECKS" != "true" ]; then
              echo "invalid_frontend_release_mode" >&2
              exit 2
            fi
          fi
          # Empty input preserves the original workflow-ref deployment behavior.
          if [ -z "$RELEASE_SOURCE_SHA" ]; then exit 0; fi
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$RELEASE_SOURCE_SHA" != "9722414a99298cd7079a88eb8e3e703d50e986de" ]; then
            echo "unapproved_console_release_source" >&2
            exit 2
          fi
          control_sha="$(git rev-parse HEAD)"
          if [ "$control_sha" != "$GITHUB_SHA" ]; then
            echo "console_control_source_mismatch" >&2
            exit 2
          fi
          if [ "$frontend_mode" = "true" ]; then
            frontend_sha="9636363371c6fe2a14a0f8e3830d56dd4b9902d9"
            git cat-file -e "${frontend_sha}^{commit}"
            git merge-base --is-ancestor "$frontend_sha" "$control_sha"
            if [ "$(git rev-parse "${frontend_sha}^{tree}")" != "92d6dd1bccb68f5659d0b3f37b50b68f4d7a714b" ] \
              || [ "$(git rev-parse "${frontend_sha}:web/strategy-switch-console/v2_asset_map.js")" != "c73e59a6fb22ab612251d331bdd4db5d9ae68b7a" ]; then
              echo "frontend_release_source_mismatch" >&2
              exit 2
            fi
          fi
          git cat-file -e "${RELEASE_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SOURCE_SHA" "$control_sha"
          expected_tree="9e2c9f2fb840d5b74401b32e1e593c4e41b62b4a"
          if [ "$(git rev-parse "${RELEASE_SOURCE_SHA}^{tree}")" != "$expected_tree" ]; then
            echo "console_release_tree_mismatch" >&2
            exit 2
          fi
          git -c advice.detachedHead=false checkout --detach "$RELEASE_SOURCE_SHA"
          if [ "$(git rev-parse HEAD)" != "$RELEASE_SOURCE_SHA" ] || [ "$(git rev-parse 'HEAD^{tree}')" != "$expected_tree" ]; then
            echo "console_selected_source_mismatch" >&2
            exit 2
          fi
          printf 'Reviewed console source: %s tree: %s\n' "$RELEASE_SOURCE_SHA" "$expected_tree"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build new console and embedded assets
        env:
          CLOUDFLARE_CF_FETCH_ENABLED: "false"
          npm_config_update_notifier: "false"
        run: |
          set -euo pipefail
          node tests/console_v2_assets_validation.mjs
          npm ci --prefix web/strategy-switch-console
          npm ci --prefix web/strategy-switch-console/frontend
          npm run build --prefix web/strategy-switch-console/frontend
          npm run sync:v2-assets --prefix web/strategy-switch-console/frontend
          node tests/console_v2_assets_validation.mjs
          npm run test:operations --prefix web/strategy-switch-console/frontend
          node tests/console_v2_i18n_validation.mjs
          node tests/console_v2_worker_validation.mjs
          node tests/ibkr_period_return_validation.mjs
          node --experimental-strip-types tests/market_benchmark_validation.mjs
          node tests/console_catalog_release_validation.mjs
          node --experimental-default-type=module tests/binance_account_facts_validation.mjs
          node tests/binance_receiver_deploy_acceptance_validation.mjs

      - name: Build config & assets from platform-config.json
        run: |
          set -euo pipefail
          python3 python/scripts/build_platform_config.py
          python3 python/scripts/build_platform_config.py --check

      - name: Overlay fixed reviewed frontend assets
        if: inputs.release_frontend_assets && inputs.source_sha != '20dad166be317dd0d57e492ed06e56dfb82b7aef'
        run: |
          set -euo pipefail
          candidate="aaa46a811a7cfa863f90261d516b197e5e554779"
          asset="web/strategy-switch-console/v2_asset_map.js"
          if [ "$(git rev-parse HEAD)" = "$candidate" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ] \
              || [ "$(git rev-parse 'HEAD^{tree}')" != "3ac93c0b2caf30a650ab46d4bf62220e45582a46" ]; then
              echo "ibkr_daily_overlay_source_mismatch" >&2
              exit 2
            fi
            staged_asset="$(mktemp)"
            trap 'rm -f "$staged_asset"' EXIT
            git show "${candidate}:${asset}" > "$staged_asset"
            [ "$(git hash-object "$staged_asset")" = "c73e59a6fb22ab612251d331bdd4db5d9ae68b7a" ] || exit 2
            cp "$staged_asset" "$asset"
            if [ -n "$(git diff --name-only "$candidate")" ] || [ -n "$(git ls-files --others --exclude-standard)" ]; then
              echo "ibkr_daily_overlay_extra_source_change" >&2
              exit 2
            fi
            exit 0
          fi
          backend="9722414a99298cd7079a88eb8e3e703d50e986de"
          frontend="9636363371c6fe2a14a0f8e3830d56dd4b9902d9"
          blob="c73e59a6fb22ab612251d331bdd4db5d9ae68b7a"
          if [ "$GITHUB_REF" != "refs/heads/main" ] || [ "$(git rev-parse HEAD)" != "$backend" ] \
            || [ "$(git rev-parse 'HEAD^{tree}')" != "9e2c9f2fb840d5b74401b32e1e593c4e41b62b4a" ] \
            || [ "$(git rev-parse "${frontend}^{tree}")" != "92d6dd1bccb68f5659d0b3f37b50b68f4d7a714b" ]; then
            echo "frontend_overlay_source_mismatch" >&2
            exit 2
          fi
          staged_asset="$(mktemp)"
          trap 'rm -f "$staged_asset"' EXIT
          git show "${frontend}:${asset}" > "$staged_asset"
          if [ "$(git hash-object "$staged_asset")" != "$blob" ]; then
            echo "frontend_overlay_blob_mismatch" >&2
            exit 2
          fi
          cp "$staged_asset" "$asset"
          if [ "$(git diff --name-only "$backend")" != "$asset" ] \
            || [ -n "$(git ls-files --others --exclude-standard)" ]; then
            echo "frontend_overlay_extra_source_change" >&2
            exit 2
          fi
          printf 'Frontend map: %s; backend source: %s\n' "$blob" "$backend"

      - name: Validate Worker assets
        run: |
          set -euo pipefail
          jq empty web/strategy-switch-console/strategy-profiles.example.json
          node --check --input-type=module < web/strategy-switch-console/strategy_profiles_asset.js
          node --check --input-type=module < web/strategy-switch-console/v2_asset_map.js
          node --check --input-type=module < web/strategy-switch-console/worker.js

      - name: Validate fixed backend with reviewed frontend
        if: inputs.release_frontend_assets
        run: |
          set -euo pipefail
          node tests/console_v2_assets_validation.mjs
          node tests/console_v2_worker_validation.mjs
          node tests/website_coverage_regression_validation.mjs
          node tests/website_cohort_regression_validation.mjs
          node tests/website_strategy_freshness_validation.mjs
          node tests/console_external_flow_validation.mjs
          node tests/external_flow_receiver_validation.mjs
          node tests/external_flow_date_precision_validation.mjs
          node tests/native_daily_returns_validation.mjs

      - name: Validate optional Binance account-facts binding
        if: env.BINANCE_ACCOUNT_FACTS_BINDING_JSON != ''
        working-directory: web/strategy-switch-console
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import { normalizeBinanceFactsBinding, assertBinanceFactsSourceBinding, assertBinanceFactsHistoryBindings } from './binance_account_facts.js';
          try {
            const binding = normalizeBinanceFactsBinding(JSON.parse(process.env.BINANCE_ACCOUNT_FACTS_BINDING_JSON));
            await assertBinanceFactsSourceBinding(binding);
            const history = process.env.BINANCE_ACCOUNT_FACTS_HISTORY_BINDINGS_JSON || '[]';
            await assertBinanceFactsHistoryBindings(JSON.parse(history), binding);
          }
          catch { console.error('binance_account_facts_binding_invalid'); process.exit(1); }
          JS

      - name: Prepare Wrangler config
        env:
          UX1_RESEARCH_JOB_TOKEN: ${{ secrets.UX1_RESEARCH_JOB_TOKEN }}
          RELEASE_FRONTEND_ASSETS: ${{ inputs.release_frontend_assets }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -z "${CLOUDFLARE_WRANGLER_CONFIG_TOML:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN or CLOUDFLARE_WRANGLER_CONFIG_TOML is required to deploy the strategy switch console." >&2
            exit 2
          fi
          if [ -n "${CLOUDFLARE_WRANGLER_CONFIG_TOML:-}" ]; then
            mkdir -p "$HOME/.config/.wrangler/config"
            printf '%s' "$CLOUDFLARE_WRANGLER_CONFIG_TOML" > "$HOME/.config/.wrangler/config/default.toml"
            chmod 600 "$HOME/.config/.wrangler/config/default.toml"
          fi
          if [ -z "${STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID:-}" ]; then
            echo "STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID is required so deploy does not drop the STRATEGY_SWITCH_CONFIG binding." >&2
            exit 2
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["WORKER_DIR"])
          source = root / "wrangler.toml.example"
          target = root / "wrangler.toml"
          account_facts_flag = os.environ.get("ACCOUNT_FACTS_READ_MODEL_ENABLED", "")
          if account_facts_flag not in ("", "true", "false"):
              raise SystemExit("ACCOUNT_FACTS_READ_MODEL_ENABLED must be empty, true, or false.")
          account_facts_token = os.environ.get("ACCOUNT_FACTS_SYNC_TOKEN", "")
          ibkr_account_facts_token = os.environ.get("IBKR_ACCOUNT_FACTS_SYNC_TOKEN", "")
          schwab_account_facts_token = os.environ.get("SCHWAB_ACCOUNT_FACTS_SYNC_TOKEN", "")
          firstrade_account_facts_token = os.environ.get("FIRSTRADE_ACCOUNT_FACTS_SYNC_TOKEN", "")
          binance_account_facts_token = os.environ.get("BINANCE_ACCOUNT_FACTS_SYNC_TOKEN", "")
          binance_account_facts_binding = os.environ.get("BINANCE_ACCOUNT_FACTS_BINDING_JSON", "")
          binance_account_facts_history = os.environ.get("BINANCE_ACCOUNT_FACTS_HISTORY_BINDINGS_JSON", "") or "[]"
          if bool(binance_account_facts_token) != bool(binance_account_facts_binding):
              raise SystemExit("Binance account-facts token and binding must be configured together.")
          if binance_account_facts_history != "[]" and not binance_account_facts_binding:
              raise SystemExit("Binance account-facts history bindings require a current binding.")
          if binance_account_facts_token and (
              binance_account_facts_token != binance_account_facts_token.strip()
              or any(ord(c) < 0x20 or ord(c) == 0x7f for c in binance_account_facts_token)
          ):
              raise SystemExit("Binance account-facts token contains invalid whitespace or HTTP controls.")
          account_facts_token_has_http_controls = any(
              ord(character) < 0x20 or ord(character) == 0x7f
              for character in account_facts_token
          )
          if account_facts_flag == "true" and (
              not account_facts_token
              or account_facts_token != account_facts_token.strip()
              or account_facts_token_has_http_controls
          ):
              raise SystemExit("ACCOUNT_FACTS_SYNC_TOKEN must be non-empty without surrounding whitespace or HTTP control characters when account facts are enabled.")
          ibkr_account_facts_token_has_http_controls = any(
              ord(character) < 0x20 or ord(character) == 0x7f
              for character in ibkr_account_facts_token
          )
          if ibkr_account_facts_token and (
              ibkr_account_facts_token != ibkr_account_facts_token.strip()
              or ibkr_account_facts_token_has_http_controls
          ):
              raise SystemExit("IBKR_ACCOUNT_FACTS_SYNC_TOKEN must not have surrounding whitespace or HTTP control characters.")
          schwab_account_facts_token_has_http_controls = any(
              ord(character) < 0x20 or ord(character) == 0x7f
              for character in schwab_account_facts_token
          )
          if schwab_account_facts_token and (
              schwab_account_facts_token != schwab_account_facts_token.strip()
              or schwab_account_facts_token_has_http_controls
          ):
              raise SystemExit("SCHWAB_ACCOUNT_FACTS_SYNC_TOKEN must not have surrounding whitespace or HTTP control characters.")
          if firstrade_account_facts_token and (
              firstrade_account_facts_token != firstrade_account_facts_token.strip()
              or any(ord(c) < 0x20 or ord(c) == 0x7f for c in firstrade_account_facts_token)
          ):
              raise SystemExit("FIRSTRADE_ACCOUNT_FACTS_SYNC_TOKEN contains invalid whitespace or HTTP controls.")
          account_facts_tokens = [
              token for token in (
                  account_facts_token,
                  ibkr_account_facts_token,
                  schwab_account_facts_token,
                  firstrade_account_facts_token,
                  binance_account_facts_token,
              ) if token
          ]
          if len(set(account_facts_tokens)) != len(account_facts_tokens):
              raise SystemExit("Account-facts platform sync tokens must be distinct.")
          account_facts_value = "true" if account_facts_flag == "true" else "false"
          runtime_daily_flag = os.environ.get("RUNTIME_DAILY_READ_MODEL_ENABLED", "")
          if runtime_daily_flag not in ("", "true", "false"):
              raise SystemExit("RUNTIME_DAILY_READ_MODEL_ENABLED must be empty, true, or false.")
          execution_evidence_token = os.environ.get("EXECUTION_EVIDENCE_SYNC_TOKEN", "")
          execution_evidence_token_has_http_controls = any(
              ord(character) < 0x20 or ord(character) == 0x7f
              for character in execution_evidence_token
          )
          if runtime_daily_flag == "true" and (
              not execution_evidence_token
              or execution_evidence_token != execution_evidence_token.strip()
              or execution_evidence_token_has_http_controls
          ):
              raise SystemExit("EXECUTION_EVIDENCE_SYNC_TOKEN must be non-empty without surrounding whitespace or HTTP control characters when runtime daily is enabled.")
          runtime_daily_value = "true" if runtime_daily_flag == "true" else "false"
          text = source.read_text(encoding="utf-8")
          account_id = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
          if account_id and "\naccount_id" not in text:
              text = text.replace("\n[vars]\n", f"\naccount_id = \"{account_id}\"\n\n[vars]\n", 1)

          kv_id = os.environ["STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID"].strip()
          commented_kv = "\n".join([
              "# [[kv_namespaces]]",
              "# binding = \"STRATEGY_SWITCH_CONFIG\"",
              "# id = \"replace-with-cloudflare-kv-namespace-id\"",
              "",
          ])
          active_kv = "\n".join([
              "[[kv_namespaces]]",
              "binding = \"STRATEGY_SWITCH_CONFIG\"",
              f"id = \"{kv_id}\"",
              "",
          ])
          if commented_kv in text:
              text = text.replace(commented_kv, active_kv, 1)
          elif 'binding = "STRATEGY_SWITCH_CONFIG"' not in text:
              text = text.rstrip() + "\n\n" + active_kv

          account_facts_placeholder = 'ACCOUNT_FACTS_READ_MODEL_ENABLED = "false"'
          if text.count(account_facts_placeholder) != 1 or "[vars]\n" not in text:
              raise SystemExit("wrangler.toml.example must define ACCOUNT_FACTS_READ_MODEL_ENABLED once under [vars].")
          text = text.replace(account_facts_placeholder, f'ACCOUNT_FACTS_READ_MODEL_ENABLED = "{account_facts_value}"', 1)

          runtime_daily_placeholder = 'RUNTIME_DAILY_READ_MODEL_ENABLED = "false"'
          if text.count(runtime_daily_placeholder) != 1 or "[vars]\n" not in text:
              raise SystemExit("wrangler.toml.example must define RUNTIME_DAILY_READ_MODEL_ENABLED once under [vars].")
          text = text.replace(runtime_daily_placeholder, f'RUNTIME_DAILY_READ_MODEL_ENABLED = "{runtime_daily_value}"', 1)

          mode = os.environ.get("UX1_PREVIEW_MODE", "")
          if mode and mode != "github_actions":
              raise SystemExit("UX1_PREVIEW_MODE must be empty or github_actions.")
          if mode == "github_actions":
              import json
              import re

              ues = os.environ.get("UX1_UES_REVISION", "").strip()
              epoch = os.environ.get("UX1_RUNTIME_EPOCH", "").strip()
              token = os.environ.get("UX1_RESEARCH_JOB_TOKEN", "")
              hashes_text = os.environ.get("UX1_EXPECTED_EVIDENCE_HASHES", "")
              if not re.fullmatch(r"[a-f0-9]{40}", ues):
                  raise SystemExit("UX1_UES_REVISION must be a 40-character lowercase SHA.")
              if not re.fullmatch(r"[a-f0-9]{32}", epoch):
                  raise SystemExit("UX1_RUNTIME_EPOCH must be a 32-character lowercase hex value.")
              if not re.fullmatch(r"[!-~]{16,256}", token):
                  raise SystemExit("UX1_RESEARCH_JOB_TOKEN must contain 16-256 printable non-space ASCII characters.")
              expected_keys = {
                  "r7_policy_sha256",
                  "r8_policy_sha256",
                  "capital_policy_sha256",
                  "settlement_policy_sha256",
                  "raw_manifest_sha256",
                  "r6_manifest_sha256",
                  "r6_materialized_file_sha256",
              }
              try:
                  hashes = json.loads(hashes_text)
              except (TypeError, json.JSONDecodeError):
                  raise SystemExit("UX1_EXPECTED_EVIDENCE_HASHES must be a JSON object with all seven evidence hashes.")
              if (
                  not isinstance(hashes, dict)
                  or set(hashes) != expected_keys
                  or any(not isinstance(value, str) or not re.fullmatch(r"[a-f0-9]{64}", value) for value in hashes.values())
              ):
                  raise SystemExit("UX1_EXPECTED_EVIDENCE_HASHES must contain exactly seven lowercase SHA-256 hashes.")

              ux1_vars = {
                  "UX1_PREVIEW_MODE": mode,
                  "UX1_UES_REVISION": ues,
                  "UX1_RUNTIME_EPOCH": epoch,
                  "UX1_EXPECTED_EVIDENCE_HASHES": hashes_text,
              }
              vars_header = "[vars]\n"
              if vars_header not in text:
                  raise SystemExit("wrangler.toml.example must contain a [vars] section.")
              rendered_vars = "".join(f"{key} = {json.dumps(value)}\n" for key, value in ux1_vars.items())
              text = text.replace(vars_header, vars_header + rendered_vars, 1)
          if os.environ.get("RELEASE_FRONTEND_ASSETS") == "true":
              # --keep-vars preserves remote values only when no local values
              # override them. This release changes code/assets, never flags.
              import re
              text, count = re.subn(r"(?ms)^\[vars\]\n.*?(?=^\[|\Z)", "[vars]\n\n", text)
              if count != 1:
                  raise SystemExit("frontend_release_vars_section_mismatch")
          target.write_text(text, encoding="utf-8")
          PY

      - name: Verify M0 research-ledger ingress token
        if: github.event_name == 'workflow_dispatch' && inputs.sync_secrets
        env:
          # Only the Worker deployment receives this copy. The M0 publisher
          # reads the same value from its separate main-only Environment,
          # never the Cloudflare deployment credentials.
          M0_RESEARCH_SYNC_TOKEN: ${{ secrets.M0_RESEARCH_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${M0_RESEARCH_SYNC_TOKEN:-}" ]; then
            echo "M0_RESEARCH_SYNC_TOKEN is required so a deployment cannot retain a stale M0 ingress credential." >&2
            exit 2
          fi

      - name: Build reviewed website Worker bundle without publishing
        if: inputs.release_frontend_assets
        working-directory: web/strategy-switch-console
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          npx wrangler@4.106.0 deploy --dry-run --config wrangler.toml --outdir "$RUNNER_TEMP/console-frontend-bundle"

      - name: Publish fixed reviewed website Worker version
        if: inputs.release_frontend_assets
        env:
          RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          node --input-type=module <<'JS'
          import { readFile, readdir } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          let checkpoint = 'configuration';
          const fail = label => { if (label) checkpoint = label; throw new Error('frontend_release_stopped'); };
          const uuid = value => typeof value === 'string' && /^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(value) ? value : fail();
          const canonical = value => JSON.stringify(value, function (_key, item) {
            return item && typeof item === 'object' && !Array.isArray(item)
              ? Object.fromEntries(Object.entries(item).sort(([a], [b]) => a.localeCompare(b))) : item;
          });
          let stage = 'configuration', httpStatus = null, uploadAttempted = false, deployAttempted = false, uploaded = null;
