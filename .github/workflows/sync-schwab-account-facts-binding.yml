name: Sync account-facts binding

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform whose protected account-facts binding action will run.
        type: choice
        default: schwab
        options:
          - schwab
          - ibkr
          - longbridge
          - firstrade
      inspect_ibkr_bindings:
        description: Read and validate existing IBKR account options and facts bindings without writing
        type: boolean
        required: true
        default: false
      inspect_ibkr_lifecycle:
        description: Read a bounded lifecycle status projection for the fixed IBKR logic target without writing
        type: boolean
        required: true
        default: false
      initialize_ibkr_bindings:
        description: Validate the three protected IBKR binding requests; preview unless apply_initial_ibkr_bindings is true
        type: boolean
        required: true
        default: false
      apply_initial_ibkr_bindings:
        description: Write the validated three IBKR bindings once and verify KV readback
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: strategy-switch-console-deploy
  cancel-in-progress: false

jobs:
  sync-binding:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: runtime-strategy-switch
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_WRANGLER_CONFIG_TOML: ${{ !inputs.inspect_ibkr_lifecycle && secrets.CLOUDFLARE_WRANGLER_CONFIG_TOML || '' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID: ${{ secrets.STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID || vars.STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID }}
      SCHWAB_ACCOUNT_FACTS_BINDING_JSON: ${{ inputs.platform == 'schwab' && !inputs.inspect_ibkr_bindings && !inputs.inspect_ibkr_lifecycle && !inputs.initialize_ibkr_bindings && secrets.SCHWAB_ACCOUNT_FACTS_BINDING_JSON || '' }}
      FIRSTRADE_ACCOUNT_FACTS_BINDING_JSON: ${{ inputs.platform == 'firstrade' && !inputs.inspect_ibkr_bindings && !inputs.inspect_ibkr_lifecycle && !inputs.initialize_ibkr_bindings && secrets.FIRSTRADE_ACCOUNT_FACTS_BINDING_JSON || '' }}
      FIRSTRADE_ACCOUNT_FACTS_RUNTIME_JSON: ${{ inputs.platform == 'firstrade' && secrets.FIRSTRADE_ACCOUNT_FACTS_RUNTIME_JSON || '' }}
      GH_TOKEN: ${{ inputs.platform == 'firstrade' && secrets.RUNTIME_SETTINGS_GH_TOKEN || '' }}
      IBKR_ACCOUNT_FACTS_SOURCE_ROTATION_JSON: ${{ inputs.platform == 'ibkr' && !inputs.inspect_ibkr_bindings && !inputs.inspect_ibkr_lifecycle && !inputs.initialize_ibkr_bindings && secrets.IBKR_ACCOUNT_FACTS_SOURCE_ROTATION_JSON || '' }}
      LONGBRIDGE_ACCOUNT_FACTS_SOURCE_ROTATION_JSON: ${{ inputs.platform == 'longbridge' && !inputs.inspect_ibkr_bindings && !inputs.inspect_ibkr_lifecycle && !inputs.initialize_ibkr_bindings && secrets.LONGBRIDGE_ACCOUNT_FACTS_SOURCE_ROTATION_JSON || '' }}
      IBKR_ACCOUNT_FACTS_INITIAL_BINDINGS_JSON: ${{ inputs.platform == 'ibkr' && inputs.initialize_ibkr_bindings && !inputs.inspect_ibkr_lifecycle && secrets.IBKR_ACCOUNT_FACTS_INITIAL_BINDINGS_JSON || '' }}
      BINDING_PLATFORM: ${{ inputs.platform || 'schwab' }}
      INSPECT_IBKR_BINDINGS: ${{ inputs.inspect_ibkr_bindings }}
      INSPECT_IBKR_LIFECYCLE: ${{ inputs.inspect_ibkr_lifecycle }}
      INITIALIZE_IBKR_BINDINGS: ${{ inputs.initialize_ibkr_bindings }}
      APPLY_INITIAL_IBKR_BINDINGS: ${{ inputs.apply_initial_ibkr_bindings }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Prepare protected Wrangler credentials
        working-directory: web/strategy-switch-console
        run: |
          set -euo pipefail
          if [ "$INSPECT_IBKR_LIFECYCLE" = "true" ]; then
            if [ "$BINDING_PLATFORM" != "ibkr" ] || [ "$INSPECT_IBKR_BINDINGS" = "true" ] || [ "$INITIALIZE_IBKR_BINDINGS" = "true" ] || [ "$APPLY_INITIAL_IBKR_BINDINGS" = "true" ]; then
              echo "status=blocked reason=inspection_mode_invalid"
              exit 1
            fi
            if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID:-}" ]; then
              echo "status=blocked reason=cloudflare_credentials_missing"
              exit 1
            fi
            exit 0
          fi
          if [ "$INSPECT_IBKR_BINDINGS" = "true" ] && [ "$BINDING_PLATFORM" != "ibkr" ]; then
            echo "status=blocked reason=inspection_platform_invalid"
            exit 1
          fi
          if [ "$APPLY_INITIAL_IBKR_BINDINGS" = "true" ] && [ "$INITIALIZE_IBKR_BINDINGS" != "true" ]; then
            echo "status=blocked reason=initialization_mode_required"
            exit 1
          fi
          if [ "$INITIALIZE_IBKR_BINDINGS" = "true" ] || [ "$APPLY_INITIAL_IBKR_BINDINGS" = "true" ]; then
            if [ "$BINDING_PLATFORM" != "ibkr" ] || [ "$INSPECT_IBKR_BINDINGS" = "true" ]; then
              echo "status=blocked reason=initialization_mode_invalid"
              exit 1
            fi
            if [ -z "${IBKR_ACCOUNT_FACTS_INITIAL_BINDINGS_JSON:-}" ]; then
              echo "status=blocked reason=initialization_request_missing"
              exit 1
            fi
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && [ -z "${CLOUDFLARE_WRANGLER_CONFIG_TOML:-}" ]; then
            echo "status=blocked reason=cloudflare_credentials_missing"
            exit 1
          fi
          if [ -z "${STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID:-}" ]; then
            echo "status=blocked reason=kv_namespace_missing"
            exit 1
          fi
          if [ -n "${CLOUDFLARE_WRANGLER_CONFIG_TOML:-}" ]; then
            umask 077
            mkdir -p "$HOME/.config/.wrangler/config"
            printf '%s' "$CLOUDFLARE_WRANGLER_CONFIG_TOML" > "$HOME/.config/.wrangler/config/default.toml"
            chmod 600 "$HOME/.config/.wrangler/config/default.toml"
          fi

      - name: Validate and sync exactly one protected binding
        working-directory: web/strategy-switch-console
        run: |
          set -euo pipefail
          if [ "$INSPECT_IBKR_LIFECYCLE" = "true" ]; then
            node ./inspect_ibkr_runtime_lifecycle.mjs
            exit $?
          fi
          umask 077
          temp_dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/schwab-binding.XXXXXX")"
          chmod 700 "$temp_dir"
          cleanup() { rm -rf -- "$temp_dir"; }
          trap cleanup EXIT

          if { [ "$BINDING_PLATFORM" = "schwab" ] && [ "$INSPECT_IBKR_BINDINGS" != "true" ] && [ "$INSPECT_IBKR_LIFECYCLE" != "true" ] && [ "$INITIALIZE_IBKR_BINDINGS" != "true" ] && [ -z "${SCHWAB_ACCOUNT_FACTS_BINDING_JSON:-}" ]; } \
            || { [ "$BINDING_PLATFORM" = "firstrade" ] && [ -z "${FIRSTRADE_ACCOUNT_FACTS_BINDING_JSON:-}" ] && [ -z "${FIRSTRADE_ACCOUNT_FACTS_RUNTIME_JSON:-}" ]; } \
            || { [ "$BINDING_PLATFORM" = "ibkr" ] && [ "$INSPECT_IBKR_BINDINGS" != "true" ] && [ "$INSPECT_IBKR_LIFECYCLE" != "true" ] && [ "$INITIALIZE_IBKR_BINDINGS" != "true" ] && [ -z "${IBKR_ACCOUNT_FACTS_SOURCE_ROTATION_JSON:-}" ]; } \
            || { [ "$BINDING_PLATFORM" = "longbridge" ] && [ "$INSPECT_IBKR_BINDINGS" != "true" ] && [ "$INSPECT_IBKR_LIFECYCLE" != "true" ] && [ "$INITIALIZE_IBKR_BINDINGS" != "true" ] && [ -z "${LONGBRIDGE_ACCOUNT_FACTS_SOURCE_ROTATION_JSON:-}" ]; }; then
            echo "status=blocked reason=binding_secret_missing"
            exit 1
          fi

          if ! npx --yes wrangler@4.106.0 kv key get account_options \
            --namespace-id "$STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID" --remote \
            > "$temp_dir/account-options.json" 2>/dev/null; then
            echo "status=blocked reason=account_options_read_failed"
            exit 1
          fi
          if ! npx --yes wrangler@4.106.0 kv key get account_facts_bindings \
            --namespace-id "$STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID" --remote \
            > "$temp_dir/account-facts-bindings.json" 2>/dev/null; then
            echo "status=blocked reason=account_facts_bindings_read_failed"
            exit 1
          fi

          if [ "$INITIALIZE_IBKR_BINDINGS" = "true" ]; then
            if ! node ./prepare_ibkr_account_facts_bindings.mjs \
              "$temp_dir/account-options.json" "$temp_dir/account-facts-bindings.json" \
              "$temp_dir/next-bindings.json" "$APPLY_INITIAL_IBKR_BINDINGS"; then
              exit 1
            fi
            if [ "$APPLY_INITIAL_IBKR_BINDINGS" != "true" ]; then
              exit 0
            fi
            if ! npx --yes wrangler@4.106.0 kv key put account_facts_bindings \
              --namespace-id "$STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID" --remote \
              --path "$temp_dir/next-bindings.json" >/dev/null 2>&1; then
              echo "status=blocked reason=binding_write_failed"
              exit 1
            fi
            if ! npx --yes wrangler@4.106.0 kv key get account_facts_bindings \
              --namespace-id "$STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID" --remote \
              > "$temp_dir/readback.json" 2>/dev/null; then
              echo "status=blocked reason=binding_readback_failed"
              exit 1
            fi
            node ./prepare_ibkr_account_facts_bindings.mjs \
              --verify "$temp_dir/next-bindings.json" "$temp_dir/readback.json"
            exit $?
          fi

          if [ "$INSPECT_IBKR_BINDINGS" = "true" ]; then
            if ! node ./inspect_ibkr_account_facts_configuration.mjs \
              "$temp_dir/account-options.json" "$temp_dir/account-facts-bindings.json"; then
              exit 1
            fi
            exit 0
          fi

          if ! node --input-type=module - "$temp_dir" <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import {
            accountFactsOptionMatchesBinding,
            normalizeAccountFactsBindings,
          } from "./account_facts.js";
          import { prepareFirstradeFactsBinding, applyFirstradeFactsSettings }
            from "./prepare_firstrade_account_facts_binding.mjs";

          const stop = (reason) => {
            process.stdout.write(`status=blocked reason=${reason}\n`);
            process.exit(1);
          };
          const tempDir = process.argv[2];
          const platform = process.env.BINDING_PLATFORM;
          if (!["schwab", "ibkr", "longbridge", "firstrade"].includes(platform)) stop("binding_platform_invalid");
          let proposedRaw;
          let rotation;
          let optionsRaw;
          let existingRaw;
          const prepareFirstrade = platform === "firstrade"
            && !process.env.FIRSTRADE_ACCOUNT_FACTS_BINDING_JSON;
          try {
            optionsRaw = JSON.parse(readFileSync(`${tempDir}/account-options.json`, "utf8"));
            existingRaw = JSON.parse(readFileSync(`${tempDir}/account-facts-bindings.json`, "utf8"));
            if (platform === "ibkr" || platform === "longbridge") {
              const rotationText = platform === "ibkr"
                ? process.env.IBKR_ACCOUNT_FACTS_SOURCE_ROTATION_JSON
                : process.env.LONGBRIDGE_ACCOUNT_FACTS_SOURCE_ROTATION_JSON;
              rotation = JSON.parse(rotationText || "");
            } else if (prepareFirstrade) {
              proposedRaw = prepareFirstradeFactsBinding(
                JSON.parse(process.env.FIRSTRADE_ACCOUNT_FACTS_RUNTIME_JSON || ""), optionsRaw, existingRaw,
              );
            } else {
              proposedRaw = JSON.parse((platform === "firstrade"
                ? process.env.FIRSTRADE_ACCOUNT_FACTS_BINDING_JSON
                : process.env.SCHWAB_ACCOUNT_FACTS_BINDING_JSON) || "");
            }
          } catch {
            stop("invalid_or_unavailable_json");
          }

          let proposed;
          let existing;
          try {
            existing = normalizeAccountFactsBindings(existingRaw);
            if (platform === "ibkr" || platform === "longbridge") {
              if (!rotation || Array.isArray(rotation)
                  || Object.keys(rotation).sort().join(",") !== "next_source_binding_id,previous_source_binding_id,target_id"
                  || !/^[a-f0-9]{64}$/.test(rotation.previous_source_binding_id)
                  || !/^[a-f0-9]{64}$/.test(rotation.next_source_binding_id)
                  || (platform === "longbridge"
                    && rotation.next_source_binding_id === rotation.previous_source_binding_id)) {
                stop("rotation_config_invalid");
              }
              if (platform === "longbridge" && !["paper", "sg"].includes(rotation.target_id)) {
                stop("rotation_config_invalid");
              }
              const candidates = existing.bindings.filter((item) => item.platform === platform
                && item.target_id === rotation.target_id);
              if (candidates.length !== 1) stop(platform === "ibkr"
                ? "expected_existing_ibkr_binding" : "expected_existing_longbridge_binding");
              if (platform === "longbridge" && (candidates[0].account_scope !== rotation.target_id
                  || candidates[0].source_binding.kind !== "deployment_scope_token_version")) {
                stop("expected_existing_longbridge_binding");
              }
              const index = existing.bindings.indexOf(candidates[0]);
              proposedRaw = {
                schema_version: existingRaw.schema_version,
                bindings: [{ ...existingRaw.bindings[index], source_binding: {
                  ...existingRaw.bindings[index].source_binding, id: rotation.next_source_binding_id,
                } }],
              };
            }
            proposed = normalizeAccountFactsBindings(proposedRaw);
          } catch {
            stop("binding_validation_failed");
          }
          if (proposed.bindings.length !== 1 || proposed.bindings[0].platform !== platform) {
            stop("expected_single_platform_binding");
          }
          const binding = proposed.bindings[0];
          if (platform === "schwab" && binding.account_scope !== "live") stop("binding_scope_mismatch");
          const options = Array.isArray(optionsRaw?.[platform]) ? optionsRaw[platform] : [];
          const matches = options.filter((option) => option?.key === binding.account_key);
          if (matches.length !== 1 || !accountFactsOptionMatchesBinding(matches[0], binding)) {
            stop("live_account_option_mismatch");
          }

          const sameKey = existing.bindings.find((item) =>
            item.platform === platform && item.account_key === binding.account_key);
          if (platform === "longbridge" && (!sameKey
              || sameKey.source_binding.id !== rotation.previous_source_binding_id)) {
            stop("previous_binding_mismatch");
          }
          if (sameKey && JSON.stringify(sameKey) === JSON.stringify(binding)) {
            if (prepareFirstrade) {
              try { applyFirstradeFactsSettings(proposedRaw); }
              catch { stop("firstrade_configuration_prepare_failed_or_unknown"); }
            }
            process.stdout.write("status=unchanged\n");
            process.exit(0);
          }
          if (platform === "ibkr" || platform === "longbridge") {
            const previousId = rotation.previous_source_binding_id;
            if (!/^[a-f0-9]{64}$/.test(previousId) || !sameKey
                || sameKey.source_binding.id !== previousId) stop("previous_binding_mismatch");
            const identity = (item) => ({ ...item, source_binding: { kind: item.source_binding.kind } });
            if (JSON.stringify(identity(sameKey)) !== JSON.stringify(identity(binding))) {
              stop("binding_identity_change_forbidden");
            }
          } else if (sameKey) {
            stop("existing_platform_binding_conflict");
          }

          const nextRaw = {
            schema_version: existingRaw.schema_version,
            bindings: platform === "ibkr" || platform === "longbridge"
              ? existingRaw.bindings.map((item) => item.platform === platform
                && item.account_key === binding.account_key
                && item.target_id === binding.target_id ? proposedRaw.bindings[0] : item)
              : [...existingRaw.bindings, proposedRaw.bindings[0]],
          };
          try {
            // Revalidate the exact payload that will be written; preserve existing entries.
            normalizeAccountFactsBindings(nextRaw);
            writeFileSync(`${tempDir}/next-bindings.json`, JSON.stringify(nextRaw), { mode: 0o600, flag: "wx" });
          } catch {
            stop("updated_bindings_validation_failed");
          }
          if (prepareFirstrade) {
            try { applyFirstradeFactsSettings(proposedRaw); }
            catch { stop("firstrade_configuration_prepare_failed_or_unknown"); }
          }
          process.stdout.write("status=prepared\n");
          NODE
          then
            exit 1
          fi

          if [ ! -f "$temp_dir/next-bindings.json" ]; then
            echo "status=unchanged"
            exit 0
          fi
          if ! npx --yes wrangler@4.106.0 kv key put account_facts_bindings \
            --namespace-id "$STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID" --remote \
            --path "$temp_dir/next-bindings.json" >/dev/null 2>&1; then
            echo "status=blocked reason=binding_write_failed"
            exit 1
          fi
          if ! npx --yes wrangler@4.106.0 kv key get account_facts_bindings \
            --namespace-id "$STRATEGY_SWITCH_CONFIG_KV_NAMESPACE_ID" --remote \
            > "$temp_dir/readback.json" 2>/dev/null; then
            echo "status=blocked reason=binding_readback_failed"
            exit 1
          fi
          if ! node --input-type=module - "$temp_dir/next-bindings.json" "$temp_dir/readback.json" <<'NODE'
          import { readFileSync } from "node:fs";
          import { isDeepStrictEqual } from "node:util";
          try {
            const expected = JSON.parse(readFileSync(process.argv[2], "utf8"));
            const actual = JSON.parse(readFileSync(process.argv[3], "utf8"));
            if (!isDeepStrictEqual(actual, expected)) process.exit(1);
          } catch {
            process.exit(1);
          }
          NODE
          then
            echo "status=blocked reason=binding_readback_mismatch"
            exit 1
          fi
          echo "status=applied"
