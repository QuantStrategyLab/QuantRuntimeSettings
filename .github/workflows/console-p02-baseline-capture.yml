name: Console P02 baseline capture
on:
  workflow_dispatch:
    inputs:
      control_sha:
        description: Reviewed control commit in main history
        type: string
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: strategy-switch-console-deploy
  cancel-in-progress: false
jobs:
  capture:
    if: github.repository == 'QuantStrategyLab/QuantRuntimeSettings' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: runtime-strategy-switch
    env:
      P02_CONTROL_SHA: ${{ inputs.control_sha }}
      DIGEST_CANDIDATES_GCS_URI: ${{ vars.DIGEST_CANDIDATES_GCS_URI }}
      DIGEST_CANDIDATES_READER_WIF_PROVIDER: ${{ vars.DIGEST_CANDIDATES_READER_WIF_PROVIDER }}
      DIGEST_CANDIDATES_READER_SERVICE_ACCOUNT: ${{ vars.DIGEST_CANDIDATES_READER_SERVICE_ACCOUNT }}
      DIGEST_GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.DIGEST_GCP_WORKLOAD_IDENTITY_PROVIDER }}
      DIGEST_GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ vars.DIGEST_GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the reviewed control revision
        env:
          QRS_P02_STORAGE_CAPABILITY_RECEIPT: ${{ secrets.QRS_P02_STORAGE_CAPABILITY_RECEIPT }}
        run: |
          set -euo pipefail
          [[ "$P02_CONTROL_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || exit 1
          git merge-base --is-ancestor "$P02_CONTROL_SHA" "$GITHUB_SHA" || exit 1
          path=.github/workflows/console-p02-baseline-capture.yml
          approved_workflow="$(git rev-parse --verify "$P02_CONTROL_SHA:$path")" || exit 1
          dispatched_workflow="$(git rev-parse --verify "$GITHUB_SHA:$path")" || exit 1
          [[ "$approved_workflow" == "$dispatched_workflow" ]] || exit 1
          tree="$(git rev-parse --verify "${P02_CONTROL_SHA}^{tree}")" || exit 1
          P02_CONTROL_TREE="$tree" python3 - <<'PY' || exit 1
          import json
          import os

          try:
              receipt = json.loads(os.environ["QRS_P02_STORAGE_CAPABILITY_RECEIPT"])
              matches = (
                  receipt["schema"] == "qrs-p02-storage-capability-v1"
                  and receipt["control_sha"] == os.environ["P02_CONTROL_SHA"]
                  and receipt["control_tree"] == os.environ["P02_CONTROL_TREE"]
              )
          except (KeyError, TypeError, ValueError):
              matches = False
          if not matches:
              raise SystemExit("R2 reviewed control binding does not match")
          PY
          git checkout --detach "$P02_CONTROL_SHA" || exit 1
          [[ "$(git rev-parse HEAD)" == "$P02_CONTROL_SHA" ]] || exit 1
          printf 'P02_CONTROL_TREE=%s\n' "$tree" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.4'
      - name: Verify protected exact-object capability
        env:
          QRS_P02_STORAGE_CAPABILITY_RECEIPT: ${{ secrets.QRS_P02_STORAGE_CAPABILITY_RECEIPT }}
        run: node scripts/console_p02_baseline_hosted.mjs verify-capability
      - name: Verify control revision and fixed offline candidate
        env:
          WRANGLER_SEND_METRICS: 'false'
          CLOUDFLARE_CF_FETCH_ENABLED: 'false'
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix web/strategy-switch-console/frontend
          node --test tests/console_p02_baseline_capture.test.mjs tests/console_p02_baseline_hosted.test.mjs
          npx --yes wrangler@4.106.0 --version
          bash scripts/console_p02_candidate_build.sh "$RUNNER_TEMP/qrs-p02-baseline-candidate"
      - name: Authenticate existing QRS WIF identity
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.DIGEST_CANDIDATES_READER_WIF_PROVIDER || vars.DIGEST_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.DIGEST_CANDIDATES_READER_SERVICE_ACCOUNT || vars.DIGEST_GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false
      - name: Capture fixed baseline and verify exact object generation
        env:
          QRS_P02_STORAGE_CAPABILITY_RECEIPT: ${{ secrets.QRS_P02_STORAGE_CAPABILITY_RECEIPT }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$P02_CONTROL_SHA" ]] || exit 1
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$P02_CONTROL_TREE" ]] || exit 1
          git diff --quiet HEAD -- || exit 1
          node scripts/console_p02_baseline_hosted.mjs capture "$RUNNER_TEMP/qrs-p02-baseline-candidate/worker.js"
