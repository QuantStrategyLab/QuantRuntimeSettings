name: QSL Exception Lifecycle

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      scope:
        description: Compatibility scope to evaluate
        required: true
        default: current
        type: choice
        options:
          - current
          - frozen

permissions:
  contents: read

concurrency:
  group: qsl-exception-lifecycle
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Prepare QuantStrategyLab workspace
        id: workspace
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_SETTINGS_GH_TOKEN || github.token }}
          QSL_SCOPE: ${{ github.event_name == 'schedule' && 'current' || inputs.scope || 'current' }}
        run: |
          set -euo pipefail
          workspace="${RUNNER_TEMP}/qsl-workspace"
          rm -rf "$workspace"
          mkdir -p "$workspace"
          ln -s "$GITHUB_WORKSPACE" "$workspace/QuantRuntimeSettings"

          python3 - <<'PY' > qsl-bundle-repos.tsv
          import os
          import tomllib
          from pathlib import Path

          qsl_payload = tomllib.loads(Path("qsl.toml").read_text(encoding="utf-8"))
          qsl_config = qsl_payload.get("qsl", qsl_payload)
          bundle = qsl_config.get("bundle") or qsl_config.get("compat")
          if isinstance(bundle, dict):
              bundle = bundle.get("bundle")
          if not isinstance(bundle, str) or not bundle.strip():
              raise SystemExit("qsl.toml missing qsl.bundle")
          bundle = bundle.strip()
          bundle_path = Path("compat/bundles") / f"{bundle}.toml"
          if not bundle_path.exists():
              raise SystemExit(f"bundle manifest not found: {bundle_path}")
          payload = tomllib.loads(bundle_path.read_text(encoding="utf-8"))
          repos = payload.get("repos")
          if not isinstance(repos, dict) or not repos:
              raise SystemExit(f"bundle manifest missing [repos]: {bundle_path}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"bundle={bundle}\n")
              output.write(f"workspace={os.environ['RUNNER_TEMP']}/qsl-workspace\n")
              output.write(f"scope={os.environ['QSL_SCOPE']}\n")
          for repo, ref in sorted(repos.items()):
              print(f"{repo}\t{ref}")
          PY

          while IFS=$'\t' read -r repo ref; do
            [ -n "$repo" ] || continue
            if [ -e "$workspace/$repo" ]; then
              continue
            fi
            gh repo clone "QuantStrategyLab/$repo" "$workspace/$repo"
            if [ "${QSL_SCOPE}" = "frozen" ]; then
              git -C "$workspace/$repo" checkout --detach "$ref"
            else
              git -C "$workspace/$repo" checkout --detach origin/main
              printf '%s\t%s\n' "$repo" "$(git -C "$workspace/$repo" rev-parse HEAD)" >> qsl-current-refs.tsv
            fi
          done < qsl-bundle-repos.tsv

      - name: Prepare optional AI dependency identity
        id: research_dependency
        if: steps.workspace.outputs.scope == 'current'
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_SETTINGS_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path
          from scripts.check_qsl_compat import (
              GitRef, _extract_git_refs, _gather_declared_current_refs,
              _is_research_extra_only_dependency, _load_qsl_config,
          )

          workspace = Path(os.environ["RUNNER_TEMP"]) / "qsl-workspace"
          pattern = re.compile(
              r"^ai-gateway-client\s*@\s*git\+https://github\.com/"
              r"QuantStrategyLab/(AIAuditBridge|QuantAIService)\.git@([0-9a-f]{40})$"
          )
          refs = set()
          for consumer, extra in (("CnEquityStrategies", "research"), ("QuantStrategyPlugins", "ai")):
              repo_root = workspace / consumer
              manifest = repo_root / "pyproject.toml"
              if not manifest.exists():
                  continue
              project = tomllib.loads(manifest.read_text(encoding="utf-8")).get("project", {})
              requirements = project.get("optional-dependencies", {}).get(extra, [])
              candidates = [item.strip() for item in requirements if isinstance(item, str)
                            and re.match(r"^ai[-_.]gateway[-_.]client\b", item.strip(), re.IGNORECASE)]
              if not candidates:
                  continue
              if len(candidates) != 1 or not (match := pattern.fullmatch(candidates[0])):
                  raise SystemExit(f"{consumer} optional {extra} AI identity is unapproved or ambiguous")
              repository, ref = match.groups()
              pin = GitRef(repo=repository, ref=ref, source="pyproject.toml", line_no=None)
              declared = {item.ref for item in _gather_declared_current_refs(_load_qsl_config(repo_root))
                          if item.repo == repository}
              locked = {item.ref for item in _extract_git_refs(repo_root / "uv.lock") if item.repo == repository}
              if declared != {ref} or locked != {ref} or not _is_research_extra_only_dependency(repo_root, pin):
                  raise SystemExit(f"{consumer} AI identity lacks matching optional manifest/lock/declaration proof")
              refs.add(ref)
          if not refs:
              raise SystemExit(0)
          if len(refs) != 1:
              raise SystemExit("optional AI consumers declare conflicting identity pins")
          ref = refs.pop()
          destination = Path(os.environ["GITHUB_WORKSPACE"]).parent / "QuantAIService"
          if destination.exists() or destination.is_symlink():
              raise SystemExit(f"refusing to overwrite existing dependency identity checkout: {destination}")
          Path(os.environ["RUNNER_TEMP"], "qsl-quantaiservice-identity-created").write_text(
              str(destination), encoding="utf-8"
          )
          subprocess.run(
              ["gh", "repo", "clone", "QuantStrategyLab/QuantAIService", str(destination)],
              check=True,
          )
          subprocess.run(["git", "-C", str(destination), "checkout", "--detach", ref], check=True)
          actual = subprocess.check_output(["git", "-C", str(destination), "rev-parse", "HEAD"], text=True).strip()
          if actual != ref:
              raise SystemExit(f"QuantAIService identity checkout mismatch: expected {ref}, got {actual}")
          origin = subprocess.check_output(
              ["git", "-C", str(destination), "remote", "get-url", "origin"], text=True
          ).strip().rstrip("/").removesuffix(".git")
          if origin not in {"https://github.com/QuantStrategyLab/QuantAIService",
                            "git@github.com:QuantStrategyLab/QuantAIService",
                            "ssh://git@github.com/QuantStrategyLab/QuantAIService"}:
              raise SystemExit("QuantAIService identity checkout has an unexpected origin")
          identity = tomllib.loads((destination / "qsl.toml").read_text(encoding="utf-8"))
          if (identity.get("tier") != "ops/tooling" or identity.get("upgrade_ring") != "ring_e"
                  or identity.get("runtime_dependency") is not False):
              raise SystemExit("QuantAIService identity must remain non-runtime ops/tooling")
          Path("qsl-quantaiservice-identity.tsv").write_text(f"QuantAIService\t{actual}\n", encoding="utf-8")
          PY

      - name: Generate QSL compatibility report
        id: report
        run: |
          set -euo pipefail
          python3 python/scripts/qslctl.py report \
            --projects-root "${{ steps.workspace.outputs.workspace }}" \
            --compat-root . \
            --scope "${{ steps.workspace.outputs.scope }}" \
            --json > qsl-report.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("qsl-report.json").read_text(encoding="utf-8"))
          lines = [
              "## QSL Exception Lifecycle Report",
              f"- Scope: `${{ steps.workspace.outputs.scope }}`",
              f"- Bundle: `${os.environ['QSL_BUNDLE']}`",
              f"- Workspace: `${os.environ['QSL_WORKSPACE']}`",
              f"- Total repositories: `{report['total_repositories']}`",
              f"- Strict repositories: `{report['strict_repositories']}`",
              f"- Warning repositories: `{report['warning_repositories']}`",
              f"- Clean repositories: `{report['clean_repositories']}`",
              "",
              "### Repository status",
          ]
          for repo in report["repositories"]:
              status = "strict" if repo["issues"] else "warning" if repo["warnings"] else "clean"
              lines.append(
                  f"- `{repo['repo']}`: `{status}` "
                  f"(issues={len(repo['issues'])}, warnings={len(repo['warnings'])})"
              )
              for message in repo["issues"] + repo["warnings"]:
                  lines.append(f"  - {message}")
          summary = "\n".join(lines).strip() + "\n"
          print(summary, end="")
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(summary, encoding="utf-8")

          current_refs = Path("qsl-current-refs.tsv")
          if current_refs.exists():
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
                  handle.write("\n### Current main checkout SHAs\n")
                  for line in current_refs.read_text(encoding="utf-8").splitlines():
                      repo, sha = line.split("\t", 1)
                      handle.write(f"- `{repo}`: `{sha}`\n")

          identity_refs = Path("qsl-quantaiservice-identity.tsv")
          if identity_refs.exists():
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
                  handle.write("\n### Optional AI dependency identity checkout\n")
                  for line in identity_refs.read_text(encoding="utf-8").splitlines():
                      repo, sha = line.split("\t", 1)
                      handle.write(f"- `{repo}`: `{sha}` (identity-only)\n")

          if report["strict_repositories"] or report["warning_repositories"]:
              raise SystemExit(1)
          PY
        env:
          QSL_BUNDLE: ${{ steps.workspace.outputs.bundle }}
          QSL_WORKSPACE: ${{ steps.workspace.outputs.workspace }}

      - name: Clean up optional AI dependency identity
        if: always()
        run: |
          set -euo pipefail
          marker="${RUNNER_TEMP}/qsl-quantaiservice-identity-created"
          if [ -f "$marker" ]; then
            destination="$(realpath -m "$(cat "$marker")")"
            expected="$(realpath -m "${GITHUB_WORKSPACE}/../QuantAIService")"
            if [ "$destination" = "$expected" ]; then
              rm -rf "$destination" "$marker"
            else
              echo "refusing to clean unexpected dependency identity path: $destination" >&2
              exit 1
            fi
          fi
