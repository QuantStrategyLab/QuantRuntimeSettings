name: Central digest package release
on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected package environment
        type: choice
        required: true
        options:
          - digest-package-release
          - digest-package-test
      operation:
        description: Package release operation
        type: choice
        required: true
        default: verify
        options:
          - verify
          - deploy
          - rollback
permissions: {}
jobs:
  prepare:
    if: github.ref == 'refs/heads/main' && inputs.operation != 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful validation of this main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
            --workflow validate.yml --event push --limit 1 --json status,conclusion \
            --jq '.[0] | .status == "completed" and .conclusion == "success"')"
          if [ "$result" != true ]; then
            echo "This main commit must pass Validate before package publication." >&2
            exit 1
          fi
      - name: Prepare the reviewed digest scripts
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digest-source/python/scripts"
          cp python/scripts/account_daily_digest.py python/scripts/account_daily_facts.py \
            python/scripts/cloud_run_daily_digest.py \
            "$RUNNER_TEMP/digest-source/python/scripts/"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-digest-source
          path: ${{ runner.temp }}/digest-source/
          if-no-files-found: error
          retention-days: 1
  release:
    needs: prepare
    if: >-
      always() && !cancelled() && github.ref == 'refs/heads/main' &&
      (needs.prepare.result == 'success' ||
       (inputs.operation == 'rollback' && needs.prepare.result == 'skipped'))
    permissions:
      id-token: write
      actions: read
    uses: QuantStrategyLab/.github/.github/workflows/deploy-azure-blob.yml@dee8bd9edca02c3466bfc1ceccb7f3dd9ae84237
    with:
      environment: ${{ inputs.target }}
      operation: ${{ inputs.operation }}
      source-artifact: ${{ inputs.operation != 'rollback' && 'daily-digest-source' || '' }}
    secrets:
      DEPLOY_CLIENT_ID: ${{ secrets.DEPLOY_CLIENT_ID }}
      DEPLOY_TENANT_ID: ${{ secrets.DEPLOY_TENANT_ID }}
      DEPLOY_STORAGE_ACCOUNT: ${{ secrets.DEPLOY_STORAGE_ACCOUNT }}
      DEPLOY_CONTAINER: ${{ secrets.DEPLOY_CONTAINER }}
      DEPLOY_BLOB: ${{ secrets.DEPLOY_BLOB }}
      DEPLOY_PREVIOUS_SHA256: ${{ secrets.DEPLOY_PREVIOUS_SHA256 }}
      DEPLOY_CANDIDATE_SHA256: ${{ secrets.DEPLOY_CANDIDATE_SHA256 }}
