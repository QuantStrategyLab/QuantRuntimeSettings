name: Central digest package release
on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected package environment
        type: choice
        required: true
        options:
          - digest-package-release
          - digest-package-test
      operation:
        description: Package release operation
        type: choice
        required: true
        default: verify
        options:
          - verify
          - deploy
          - rollback
permissions: {}
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    uses: QuantStrategyLab/.github/.github/workflows/deploy-azure-blob.yml@0d5360a64974a25514e32da2f645b032614e367d
    with:
      environment: ${{ inputs.target }}
      operation: ${{ inputs.operation }}
