name: Provision SOXL V7 Review Credential

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Write the credential after checks (false performs read-only diagnosis)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: provision-soxl-v7-review-credential
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: runtime-strategy-switch
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check or explicitly bind the fixed review credential
        env:
          APPLY_CREDENTIAL: ${{ inputs.apply }}
          GH_TOKEN: ${{ secrets.RUNTIME_SETTINGS_GH_TOKEN }}
          RESEARCH_PROMOTION_SYNC_TOKEN: ${{ secrets.RESEARCH_PROMOTION_SYNC_TOKEN }}
        run: |
          args=()
          if [[ "$APPLY_CREDENTIAL" == "true" ]]; then args+=(--apply); fi
          python3 scripts/provision_soxl_v7_review_credential.py "${args[@]}"
