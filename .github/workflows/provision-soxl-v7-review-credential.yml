name: Provision SOXL V7 Review Credential

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provision-soxl-v7-review-credential
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: runtime-strategy-switch
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Bind existing review credential to the fixed main-only destination
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_SETTINGS_GH_TOKEN }}
          RESEARCH_PROMOTION_SYNC_TOKEN: ${{ secrets.RESEARCH_PROMOTION_SYNC_TOKEN }}
        run: python3 scripts/provision_soxl_v7_review_credential.py
