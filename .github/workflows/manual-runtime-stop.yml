name: Manual Runtime Stop

on:
  workflow_dispatch:
    inputs:
      stop_request:
        description: "Exact existing target identity only; current configuration is read by the worker."
        required: true
        type: string
      apply:
        description: "Save the disable setting. This does not prove the platform has applied it."
        required: true
        type: boolean
        default: false
      confirm:
        description: "STOP_ONLY is required for writes. No activation, sync, cancellation or liquidation."
        required: false
        type: string
      apply_hk_stop:
        description: "Save the LongBridge HK stop, read it back, then request one platform stop. Dispatch does not prove the platform applied it."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# A platform can have multiple targets in one variable. Serialize known writers
# in this repository, including the existing switch workflow; target-level
# concurrency is insufficient. This is not a complete cross-workflow or
# cross-repository lock; writers still rely on pre-write comparison, readback,
# fail-closed checks, and main-only apply gates.
concurrency:
  group: runtime-strategy-switch-${{ fromJSON(inputs.stop_request).runtime_target.platform_id }}
  cancel-in-progress: false

jobs:
  stop:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: runtime-strategy-switch
    env:
      GH_TOKEN: ${{ secrets.RUNTIME_SETTINGS_GH_TOKEN }}
      APPLY_STOP: ${{ inputs.apply }}
      CONFIRM_STOP: ${{ inputs.confirm }}
      APPLY_HK_STOP: ${{ inputs.apply_hk_stop }}
      RUNTIME_SETTINGS_PLATFORM_REPOSITORIES_JSON: ${{ vars.RUNTIME_SETTINGS_PLATFORM_REPOSITORIES_JSON }}
      RUNTIME_SETTINGS_LONGBRIDGE_REPO: ${{ vars.RUNTIME_SETTINGS_LONGBRIDGE_REPO }}
      RUNTIME_SETTINGS_IBKR_REPO: ${{ vars.RUNTIME_SETTINGS_IBKR_REPO }}
      RUNTIME_SETTINGS_SCHWAB_REPO: ${{ vars.RUNTIME_SETTINGS_SCHWAB_REPO }}
      RUNTIME_SETTINGS_FIRSTRADE_REPO: ${{ vars.RUNTIME_SETTINGS_FIRSTRADE_REPO }}
      RUNTIME_SETTINGS_QMT_REPO: ${{ vars.RUNTIME_SETTINGS_QMT_REPO }}
      RUNTIME_SETTINGS_BINANCE_REPO: ${{ vars.RUNTIME_SETTINGS_BINANCE_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Save the stop setting or apply an already-saved HK stop
        shell: bash
        run: |
          set -euo pipefail
          set --
          if [ "${APPLY_HK_STOP:-false}" = "true" ]; then
            set -- --apply-hk-stop
          fi
          if [ "${APPLY_STOP}" = "true" ]; then
            python3 python/scripts/runtime_settings.py stop --yes --confirm "${CONFIRM_STOP}" "$@"
          else
            python3 python/scripts/runtime_settings.py stop "$@"
          fi
      - name: Report the verification boundary
        run: |
          echo 'Ordinary requests save stop configuration only. An HK apply request saves the stop setting, checks the exact readback, then requests one platform stop. Dispatch is not application: use the platform run and fresh lifecycle readback. Cancellation, liquidation and completion of in-flight work are never implied.' >> "$GITHUB_STEP_SUMMARY"
