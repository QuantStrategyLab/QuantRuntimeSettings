name: Observe strategy health publication tail
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    if: github.repository == 'QuantStrategyLab/QuantRuntimeSettings' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: runtime-strategy-switch
    timeout-minutes: 5
    env:
      STRATEGY_SWITCH_CONSOLE_URL: ${{ vars.STRATEGY_SWITCH_CONSOLE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Observe bounded live tail
        run: node --disable-warning=ExperimentalWarning scripts/tail_strategy_health.mjs
