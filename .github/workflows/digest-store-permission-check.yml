name: Digest Store Permission Check

# NOTIFY-04 B2 (read-only): probe whether this repo's GitHub identity can write /
# read the shared digest-candidate prefix in the privately configured bucket, and
# whether the bucket is private. Uses testIamPermissions / metadata reads only;
# never creates, overwrites or deletes objects. Prints booleans and HTTP codes.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ secrets.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}
      DIGEST_STORE_BUCKET: ${{ secrets.DIGEST_STORE_BUCKET }}
      DIGEST_STORE_PREFIX: digest-candidates/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Require private infrastructure configuration
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${GCP_PROJECT_ID:-}" ] || { echo "GCP_PROJECT_ID is required" >&2; exit 2; }
          [ -n "${GCP_WORKLOAD_IDENTITY_PROVIDER:-}" ] || { echo "GCP_WORKLOAD_IDENTITY_PROVIDER is required" >&2; exit 2; }
          [ -n "${GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT:-}" ] || { echo "GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT is required" >&2; exit 2; }
          [ -n "${DIGEST_STORE_BUCKET:-}" ] || { echo "DIGEST_STORE_BUCKET is required" >&2; exit 2; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Probe digest store permissions (read-only)
        run: python3 python/scripts/digest_store_permission_check.py
