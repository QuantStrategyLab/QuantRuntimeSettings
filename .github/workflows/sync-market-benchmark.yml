name: Sync Market Benchmark Closes

# After US cash equity close (approx 20:00–21:00 UTC). Weekday evenings UTC.
# First close on/after MARKET_BENCHMARK_INCEPTION_DATE=2026-10-09 is OK; empty
# pre-close runs exit soft-success without fabricating points.

on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare candidate and stored conflict counts; no prices or POST.
        required: false
        type: boolean
        default: false
      range:
        description: Yahoo chart range query (e.g. 5d, 10d).
        required: false
        type: string
        default: "10d"
      apply_revision:
        description: Apply an owner-approved benchmark revision rebuilt in-job from Yahoo (requires approved_proposal_sha256).
        required: false
        type: boolean
        default: false
      approved_proposal_sha256:
        description: Owner-approved proposal_sha256 (64 hex chars); the rebuilt proposal must match exactly.
        required: false
        type: string
        default: ""
      apply_dry_run:
        description: With apply_revision, plan only (hash/count logs, no POST, no revision token).
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sync-market-benchmark
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: runtime-strategy-switch
    env:
      MARKET_BENCHMARK_SYNC_URL: ${{ vars.MARKET_BENCHMARK_SYNC_URL }}
      # Prefer dedicated token; fall back to STRATEGY_SWITCH_SYNC_TOKEN (Worker accepts either).
      MARKET_BENCHMARK_SYNC_TOKEN: ${{ secrets.MARKET_BENCHMARK_SYNC_TOKEN || secrets.STRATEGY_SWITCH_SYNC_TOKEN || secrets.RUNTIME_SETTINGS_DISPATCH_TOKEN }}
      MARKET_BENCHMARK_RANGE: ${{ inputs.range || '10d' }}
      MARKET_BENCHMARK_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
    steps:
      - name: Require MARKET_BENCHMARK_SYNC_URL
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MARKET_BENCHMARK_SYNC_URL:-}" ]]; then
            echo "::error::MARKET_BENCHMARK_SYNC_URL is required" >&2
            exit 2
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Fetch closes and sync
        # Scheduled runs and plain dispatches keep the frozen sync path unchanged.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.apply_revision) }}
        run: node scripts/sync_market_benchmark_closes.mjs

      - name: Apply approved revision
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_revision }}
        env:
          MARKET_BENCHMARK_APPLY_REVISION: "true"
          MARKET_BENCHMARK_DRY_RUN: ${{ inputs.apply_dry_run && 'true' || 'false' }}
          MARKET_BENCHMARK_APPROVED_PROPOSAL_SHA256: ${{ inputs.approved_proposal_sha256 }}
          # Dedicated revision bearer, exposed only to this step and only for the real write.
          MARKET_BENCHMARK_REVISION_TOKEN: ${{ !inputs.apply_dry_run && secrets.MARKET_BENCHMARK_REVISION_TOKEN || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${MARKET_BENCHMARK_APPROVED_PROPOSAL_SHA256}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::approved_proposal_sha256 must be 64 lowercase hex characters" >&2
            exit 2
          fi
          node scripts/sync_market_benchmark_closes.mjs
