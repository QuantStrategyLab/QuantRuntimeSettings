name: Provision Binance Recovery Credentials

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provision-binance-recovery-credentials
  cancel-in-progress: false

jobs:
  provision:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: runtime-strategy-switch
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Deliver existing recovery credentials to the fixed destination
        env:
          GH_TOKEN: ${{ secrets.RUNTIME_SETTINGS_GH_TOKEN }}
          RECONCILIATION_RECOVERY_SYNC_TOKEN: ${{ secrets.RECONCILIATION_RECOVERY_SYNC_TOKEN }}
          RECONCILIATION_RECOVERY_CONTROLLER_TOKEN: ${{ secrets.RECONCILIATION_RECOVERY_CONTROLLER_TOKEN }}
        run: bash scripts/provision_binance_recovery_credentials.sh
