version: 2
updates:
- package-ecosystem: pip
  directory: /python
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  commit-message:
    prefix: "chore"
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  groups:
    actions:
      patterns:
        - "*"
  open-pull-requests-limit: 3
  commit-message:
    prefix: "chore"
  ignore:
  - dependency-name: '*'
    update-types:
    - version-update:semver-major
- package-ecosystem: npm
  directory: /web/strategy-switch-console
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  commit-message:
    prefix: "chore"
- package-ecosystem: npm
  directory: /web/strategy-switch-console/frontend
  schedule:
    interval: weekly
  open-pull-requests-limit: 5
  commit-message:
    prefix: "chore"
