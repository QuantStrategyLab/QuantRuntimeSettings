# INSTALL: copy this file to .github/workflows/daily-digest-notify.yml
# with a credential that has the GitHub OAuth `workflow` scope, then push.
# Until then Actions will not schedule or accept workflow_dispatch for this job.
#
name: Daily Digest Notify

# Post-close QuantSentinel aggregator: one message for all platforms that
# actually ran. Empty evidence → heartbeat via daily_digest_notify renderer.
# Distinguishes verified idle vs source-read failure (never claim link healthy
# when GitHub/candidates evidence could not be loaded).
#
# Schedule (GitHub Actions cron is UTC):
#   0 22 * * 1-5  == Tue–Sat 06:00 Asia/Shanghai (covers prior US RTH close).
# Optional Asia cash session digest is not scheduled yet; add a second cron
# only after an Asia evidence contract exists (do not invent runs).
#
# DIGEST_CANDIDATES wiring (optional, preferred over GitHub stubs):
#   - Environment secret DIGEST_CANDIDATES_JSON → materialized to a local file
#   - or Environment variable DIGEST_CANDIDATES_PATH pointing at a runner file
#   Do NOT upload account-asset candidates as a public artifact by default.
#   See docs/digest-candidates-wiring.zh-CN.md

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only; do not call Telegram (recommended for first test)."
        required: true
        type: boolean
        default: true
      preflight_private_store:
        description: "Read private candidates only for a dry-run on main; no production configuration changes."
        required: true
        type: boolean
        default: false
      business_day:
        description: "Override America/New_York business day YYYY-MM-DD (empty = today NY)."
        required: false
        type: string
        default: ""
      locale:
        description: "zh or en (empty = QSL_NOTIFY_LANG / NOTIFY_LANG / zh)."
        required: false
        type: string
        default: ""
      layout:
        description: "Message layout. v1 = current production; sections_v2 = NOTIFY-04 four-section report (try with dry_run first)."
        required: false
        type: choice
        default: v1
        options:
          - v1
          - sections_v2
      include_github_evidence:
        description: "Query allowlisted platform workflow conclusions (counts stay unknown unless candidates supply them)."
        required: true
        type: boolean
        default: true
  schedule:
    # Asia/Shanghai Tue–Sat 06:00 → UTC Mon–Fri 22:00
    - cron: "0 22 * * 1-5"

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-digest-notify
  cancel-in-progress: false

jobs:
  digest:
    name: Aggregate and notify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: runtime-strategy-switch
    env:
      # Sentinel secret *name* contract (value never committed).
      TELEGRAM_TOKEN_SECRET_NAME: ${{ vars.TELEGRAM_TOKEN_SECRET_NAME || 'quant-sentinel-telegram-bot-token' }}
      # Optional direct Environment secret; prefer this when present.
      # Prefer Environment TELEGRAM_TOKEN; fall back to org/repo TG_TOKEN (legacy name).
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      QSL_GLOBAL_TELEGRAM_CHAT_ID: ${{ secrets.QSL_GLOBAL_TELEGRAM_CHAT_ID }}
      GLOBAL_TELEGRAM_CHAT_ID: ${{ secrets.GLOBAL_TELEGRAM_CHAT_ID }}
      # Existing console authority; maintenance writes are main-only and never dry-run.
      STRATEGY_SWITCH_CONSOLE_URL: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) && vars.STRATEGY_SWITCH_CONSOLE_URL || '' }}
      STRATEGY_SWITCH_SYNC_TOKEN: ${{ github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true) && secrets.STRATEGY_SWITCH_SYNC_TOKEN || '' }}
      QSL_NOTIFY_LANG: ${{ vars.QSL_NOTIFY_LANG || vars.NOTIFY_LANG || 'zh' }}
      NOTIFY_LANG: ${{ vars.NOTIFY_LANG || 'zh' }}
      # Cross-repo evidence (optional). Same token used elsewhere for remote reads.
      GH_TOKEN: ${{ secrets.RUNTIME_SETTINGS_GH_TOKEN || github.token }}
      DIGEST_GH_TOKEN: ${{ secrets.RUNTIME_SETTINGS_GH_TOKEN || github.token }}
      # Optional producer candidates (Environment secret). Never log the value.
      DIGEST_CANDIDATES_JSON: ${{ secrets.DIGEST_CANDIDATES_JSON }}
      # Optional path override (Environment variable); relative to workspace.
      DIGEST_CANDIDATES_PATH_VAR: ${{ vars.DIGEST_CANDIDATES_PATH || '' }}
      # NOTIFY-04 B2: producer store (unset = disabled). Production value:
      #   gs://qsl-runtime-logs-shared/digest-candidates  (reader SA: prefix-conditioned objectViewer)
      # Layout: <uri>/<platform_id>/<business_day>/<target>.json
      DIGEST_CANDIDATES_GCS_URI: ${{ vars.DIGEST_CANDIDATES_GCS_URI || '' }}
      DIGEST_CANDIDATES_READER_WIF_PROVIDER: ${{ vars.DIGEST_CANDIDATES_READER_WIF_PROVIDER || vars.DIGEST_GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/252919773759/locations/global/workloadIdentityPools/github-actions/providers/github-main' }}
      DIGEST_CANDIDATES_READER_SERVICE_ACCOUNT: ${{ vars.DIGEST_CANDIDATES_READER_SERVICE_ACCOUNT || vars.DIGEST_GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT || 'qsl-artifact-evidence@longbridgequant.iam.gserviceaccount.com' }}
      # GCP project that hosts a sentinel bot-token replica (LongBridge path).
      GCP_PROJECT_ID: ${{ vars.DIGEST_GCP_PROJECT_ID || 'longbridgequant' }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.DIGEST_GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/252919773759/locations/global/workloadIdentityPools/github-actions/providers/github-main' }}
      GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT: ${{ vars.DIGEST_GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT || 'qsl-artifact-evidence@longbridgequant.iam.gserviceaccount.com' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Resolve dry-run and business day
        id: opts
        env:
          INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          INPUT_PREFLIGHT_PRIVATE_STORE: ${{ inputs.preflight_private_store || false }}
          INPUT_EVENT_NAME: ${{ github.event_name }}
          INPUT_REF: ${{ github.ref }}
          INPUT_BUSINESS_DAY: ${{ inputs.business_day || '' }}
          INPUT_LOCALE: ${{ inputs.locale || '' }}
          INPUT_LAYOUT: ${{ inputs.layout || 'v1' }}
          INPUT_INCLUDE_GITHUB: ${{ github.event_name != 'workflow_dispatch' && true || inputs.include_github_evidence }}
        run: |
          set -euo pipefail
          preflight=false
          case "$INPUT_PREFLIGHT_PRIVATE_STORE" in
            true)
              if [[ "$INPUT_EVENT_NAME" != "workflow_dispatch" || "$INPUT_DRY_RUN" != "true" || "$INPUT_REF" != "refs/heads/main" ]]; then
                echo "::error::candidate_store_preflight_requires_manual_main_dry_run" >&2
                exit 2
              fi
              # Runner-only default; preserve any configured URI and reader identity.
              if [[ -z "${DIGEST_CANDIDATES_GCS_URI:-}" ]]; then
                echo "DIGEST_CANDIDATES_GCS_URI=gs://qsl-runtime-logs-shared/digest-candidates" >> "$GITHUB_ENV"
              fi
              preflight=true
              ;;
            false|"") ;;
            *)
              echo "::error::candidate_store_preflight_input_invalid" >&2
              exit 2
              ;;
          esac
          echo "preflight_private_store=$preflight" >> "$GITHUB_OUTPUT"
          mkdir -p data/output/daily-digest data/input/daily-digest
          if [[ "$INPUT_EVENT_NAME" == "schedule" ]]; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            if [[ "$INPUT_DRY_RUN" == "true" ]]; then
              echo "dry_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "dry_run=false" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "business_day=$INPUT_BUSINESS_DAY" >> "$GITHUB_OUTPUT"
          echo "locale=$INPUT_LOCALE" >> "$GITHUB_OUTPUT"
          # Scheduled runs stay on v1 until the NOTIFY-04 switch-over is approved.
          if [[ "$INPUT_EVENT_NAME" == "schedule" ]]; then
            echo "layout=v1" >> "$GITHUB_OUTPUT"
          else
            case "$INPUT_LAYOUT" in
              sections_v2) echo "layout=sections_v2" >> "$GITHUB_OUTPUT" ;;
              *) echo "layout=v1" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
          if [[ "$INPUT_INCLUDE_GITHUB" == "true" ]]; then
            echo "include_github=true" >> "$GITHUB_OUTPUT"
          else
            echo "include_github=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize DIGEST_CANDIDATES input (optional)
        id: candidates
        env:
          CANDIDATES_JSON: ${{ env.DIGEST_CANDIDATES_JSON }}
          CANDIDATES_PATH_VAR: ${{ env.DIGEST_CANDIDATES_PATH_VAR }}
        run: |
          set -euo pipefail
          dest="data/input/daily-digest/candidates.json"
          if [[ -n "${CANDIDATES_JSON:-}" ]]; then
            # Secret JSON materialized locally; do not echo contents.
            printf '%s' "$CANDIDATES_JSON" > "$dest"
            echo "DIGEST_CANDIDATES_PATH=$dest" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "source=environment_secret_json" >> "$GITHUB_OUTPUT"
            echo "Candidates input: Environment secret DIGEST_CANDIDATES_JSON → $dest"
          elif [[ -n "${CANDIDATES_PATH_VAR:-}" ]]; then
            if [[ ! -f "$CANDIDATES_PATH_VAR" ]]; then
              echo "DIGEST_CANDIDATES_PATH var set but file missing." >&2
              echo "configured=true" >> "$GITHUB_OUTPUT"
              echo "source=path_missing" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "DIGEST_CANDIDATES_PATH=$CANDIDATES_PATH_VAR" >> "$GITHUB_ENV"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "source=environment_path_var" >> "$GITHUB_OUTPUT"
            echo "Candidates input: configured private path."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "source=none" >> "$GITHUB_OUTPUT"
            echo "No DIGEST_CANDIDATES injected; aggregator uses GitHub stubs only (counts unknown)."
            echo "Wire steps: docs/digest-candidates-wiring.zh-CN.md"
          fi

      - name: Authenticate to Google Cloud for producer candidates (optional)
        id: candidates_gcp_auth
        if: ${{ env.DIGEST_CANDIDATES_GCS_URI != '' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.DIGEST_CANDIDATES_READER_WIF_PROVIDER }}
          service_account: ${{ env.DIGEST_CANDIDATES_READER_SERVICE_ACCOUNT }}

      - name: Set up gcloud for producer candidates (optional)
        if: ${{ steps.candidates_gcp_auth.outcome == 'success' }}
        uses: google-github-actions/setup-gcloud@v3

      - name: Fetch producer candidates from private store (optional)
        id: candidates_fetch
        if: ${{ env.DIGEST_CANDIDATES_GCS_URI != '' }}
        # Form the receipt and preserve exception delivery before the final gate.
        continue-on-error: true
        env:
          INPUT_BUSINESS_DAY: ${{ steps.opts.outputs.business_day }}
          AUTH_OUTCOME: ${{ steps.candidates_gcp_auth.outcome }}
        run: |
          set -euo pipefail
          umask 077
          # Never echo row contents (may carry equity); counts only.
          store_failed() {
            printf 'DIGEST_CANDIDATES_STORE_STATUS=failed\nDIGEST_CANDIDATES_STORE_REASON=%s\n' "$1" >> "$GITHUB_ENV"
            echo "::warning::$1" >&2
            exit 1
          }
          # Fail closed if the step ends before it records a complete outcome.
          printf 'DIGEST_CANDIDATES_STORE_STATUS=failed\nDIGEST_CANDIDATES_STORE_REASON=candidate_store_outcome_missing\n' >> "$GITHUB_ENV"
          if [[ "$AUTH_OUTCOME" != "success" ]]; then
            store_failed candidate_store_auth_failed
          fi
          day="${INPUT_BUSINESS_DAY:-$(TZ=America/New_York date +%F)}"
          fetched="data/input/daily-digest/fetched"
          mkdir -p "$fetched"
          uri="${DIGEST_CANDIDATES_GCS_URI%/}"
          listing="$RUNNER_TEMP/digest-candidates-list.txt"
          if ! gcloud storage ls "${uri}/*/${day}/*.json" > "$listing" 2>/dev/null; then
            store_failed candidate_store_list_failed
          fi
          found=0
          while IFS= read -r object; do
            [[ "$object" == "${uri}/"* ]] || store_failed candidate_store_list_failed
            [[ "$object" == *"/${day}/"*.json ]] || continue
            if ! gcloud storage cp "$object" "$fetched/candidate-${found}.json" --no-user-output-enabled > /dev/null 2>&1; then
              store_failed candidate_store_copy_failed
            fi
            found=$((found + 1))
          done < "$listing"
          echo "Producer candidate files for ${day}: ${found}"
          base="${DIGEST_CANDIDATES_PATH:-}"
          out="data/input/daily-digest/candidates-merged.json"
          if ! python3 python/scripts/merge_digest_candidates.py ${base:+--base "$base"} --input-dir "$fetched" --output "$out"; then
            store_failed candidate_store_merge_failed
          fi
          printf 'DIGEST_CANDIDATES_PATH=%s\nDIGEST_CANDIDATES_STORE_STATUS=loaded\nDIGEST_CANDIDATES_STORE_REASON=\n' "$out" >> "$GITHUB_ENV"

      - name: Authenticate to Google Cloud for sentinel secret (optional)
        id: gcp_auth
        if: ${{ env.TELEGRAM_TOKEN == '' && env.TELEGRAM_TOKEN_SECRET_NAME != '' && steps.opts.outputs.dry_run != 'true' }}
        continue-on-error: true
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_WORKLOAD_IDENTITY_SERVICE_ACCOUNT }}

      - name: Set up gcloud for sentinel secret (optional)
        if: ${{ steps.gcp_auth.outcome == 'success' }}
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Aggregate, render, and send daily digest
        id: send
        # A failed private path may still deliver only an independently sourced
        # maintenance block. The original failed step and sender nonzero remain.
        if: ${{ success() || (!cancelled() && github.ref == 'refs/heads/main' && steps.opts.outcome == 'success' && steps.opts.outputs.dry_run != 'true' && steps.candidates.outcome == 'failure') }}
        env:
          DIGEST_CANDIDATES_INPUT_STATUS: ${{ steps.candidates.outcome }}
          DIGEST_BUSINESS_DAY: ${{ steps.opts.outputs.business_day }}
          DIGEST_DRY_RUN: ${{ steps.opts.outputs.dry_run }}
        run: |
          set -euo pipefail
          args=(
            python3 python/scripts/send_daily_digest_telegram.py
            --write-receipt data/output/daily-digest/receipt.json
            --layout "${{ steps.opts.outputs.layout }}"
          )
          if [[ -n "${{ steps.opts.outputs.locale }}" ]]; then
            args+=(--locale "${{ steps.opts.outputs.locale }}")
          fi
          if [[ "${{ steps.opts.outputs.include_github }}" != "true" ]]; then
            args+=(--no-github)
          fi
          if [[ "${{ steps.opts.outputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          # Prefer explicit --candidates when env path was materialized.
          if [[ -n "${DIGEST_CANDIDATES_PATH:-}" ]]; then
            args+=(--candidates "$DIGEST_CANDIDATES_PATH")
          fi
          # The local sender preview and full receipt contain private facts.
          umask 077
          "${args[@]}" > "$RUNNER_TEMP/digest-message-private.log" 2>&1

      - name: Prepare public receipt summary
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! -f data/output/daily-digest/receipt.json ]]; then
            exit 0
          fi
          python3 python/scripts/project_public_digest_receipt.py \
            --input data/output/daily-digest/receipt.json \
            --output data/output/daily-digest/receipt-public.json \
            --source-sha "$SOURCE_SHA"

      - name: Summarize (no secrets)
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          receipt_path = Path("data/output/daily-digest/receipt-public.json")
          print("## QuantSentinel daily digest")
          print()
          if not receipt_path.exists():
              print("- receipt: `missing`")
              raise SystemExit(0)
          receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
          print(f"- status: `{receipt.get('status')}`")
          print(f"- business_day: `{receipt.get('business_day')}`")
          print(f"- locale: `{receipt.get('locale')}`")
          print(f"- layout: `{receipt.get('layout')}`")
          window = receipt.get("window") or {}
          if window:
              print(f"- window (Asia/Shanghai): `{window.get('start_local')}` → `{window.get('end_local')}`")
          print(f"- evidence_status: `{receipt.get('evidence_status')}`")
          print(f"- run_count: `{receipt.get('run_count')}`")
          print(f"- total_fills: `{receipt.get('total_fills')}`")
          print(f"- total_fills_status: `{receipt.get('total_fills_status')}`")
          print(f"- dry_run: `{receipt.get('dry_run')}`")
          print(f"- delivered: `{receipt.get('delivered')}`")
          print(f"- secret_name_contract: `{receipt.get('secret_name_contract')}`")
          coverage = receipt.get("source_coverage") or {}
          if coverage:
              print("- source_coverage:")
              print(f"  - candidates_configured: `{coverage.get('candidates_configured')}`")
              print(f"  - candidates_count: `{coverage.get('candidates_count')}`")
              print(f"  - github_enabled: `{coverage.get('github_enabled')}`")
              print(f"  - github_sources_queried: `{coverage.get('github_sources_queried')}`")
              print(f"  - github_sources_matched: `{coverage.get('github_sources_matched')}`")
              print(f"  - has_source_failures: `{coverage.get('has_source_failures')}`")
              print(f"  - is_complete_for_verified_idle: `{coverage.get('is_complete_for_verified_idle')}`")
              print(f"  - stale_candidates_count: `{coverage.get('stale_candidates_count')}`")
          failures = receipt.get("failures") or coverage.get("github_failures") or []
          if failures:
              print("- failures:")
              for item in failures:
                  if isinstance(item, dict):
                      print(
                          f"  - `{item.get('source_kind')}` "
                          f"reason=`{item.get('reason_code')}`"
                      )
          missing = receipt.get("missing") or []
          if missing:
              print("- missing configuration:")
              for item in missing:
                  print(f"  - `{item}`")
          PY

      - name: Upload receipt artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-digest-receipt
          path: data/output/daily-digest/receipt-public.json
          if-no-files-found: warn
          # Complete receipt, candidates and message previews stay on the runner.

      - name: Require complete private candidate intake
        if: ${{ always() && env.DIGEST_CANDIDATES_STORE_STATUS == 'failed' }}
        run: |
          echo "::error::Private candidate intake failed; see the public receipt source reason."
          exit 1
