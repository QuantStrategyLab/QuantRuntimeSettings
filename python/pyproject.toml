[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-runtime-settings"
version = "0.1.0"
description = "Declarative runtime target settings for QuantStrategyLab deployments"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
qsl-development-research-review = "development_research_review_consumer:main"

[tool.setuptools]
py-modules = ["development_research_review_consumer"]
package-dir = {"" = "scripts"}

[tool.ruff]
line-length = 120
target-version = "py311"
